[project]
name = "academy-tractian-e2"
version = "0.1.0"
description = "Framework-neutral contracts and evaluation harness for the TRACTIAN project"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["research/e2"]

[tool.pytest.ini_options]
testpaths = ["research/e2/tests"]
