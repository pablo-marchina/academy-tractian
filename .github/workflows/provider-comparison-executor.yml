name: provider-comparison-executor

on:
  pull_request:
    paths:
      - "src/academy_tractian/provider_comparison.py"
      - "tests/test_provider_comparison.py"
      - "scripts/research/validate_provider_comparison_executor.py"
      - "research/results/provider-comparison-executor-provider-free-fixture-2026-08-28.json"
      - "research/experiments/provider-model-comparison-design-manifest-v1.json"
      - "research/experiments/provider-model-comparison-dev-population-v1.json"
      - "research/frozen/provider-model-live-comparison-authorization-v1.json"
      - "docs/adr/009-provider-http-clients-live-comparison-authorization-2026-08-28.md"
      - "src/academy_tractian/provider_clients.py"
      - "src/academy_tractian/decision_source.py"
      - ".github/workflows/provider-comparison-executor.yml"
  push:
    branches:
      - main
    paths:
      - "src/academy_tractian/provider_comparison.py"
      - "tests/test_provider_comparison.py"
      - "scripts/research/validate_provider_comparison_executor.py"
      - "research/results/provider-comparison-executor-provider-free-fixture-2026-08-28.json"
      - "research/experiments/provider-model-comparison-design-manifest-v1.json"
      - "research/experiments/provider-model-comparison-dev-population-v1.json"
      - "research/frozen/provider-model-live-comparison-authorization-v1.json"
      - "docs/adr/009-provider-http-clients-live-comparison-authorization-2026-08-28.md"
      - "src/academy_tractian/provider_clients.py"
      - "src/academy_tractian/decision_source.py"
      - ".github/workflows/provider-comparison-executor.yml"

jobs:
  validate-provider-free-executor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and controller test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Validate frozen provider-free fixture projection
        run: python scripts/research/validate_provider_comparison_executor.py

      - name: Run executor-specific tests
        run: python -m pytest -q tests/test_provider_comparison.py

      - name: Regress ADR-009 authorization validator
        run: python scripts/research/validate_provider_live_authorization.py

      - name: Regress full production surface
        run: python -m pytest -q tests

      - name: Regress ADR-004 controller boundary
        run: python -m pytest -q research/e2/tests/test_controller.py
