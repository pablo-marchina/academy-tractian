name: research-e14l-dev-only-120b-medium-reasoning-strict-4096

on:
  push:
    branches:
      - research/systematic-foundation
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e14l-dev-only-medium-reasoning-dry-run:
    runs-on: ubuntu-24.04
    env:
      E8_GROQ_MODEL: openai/gpt-oss-120b
      E8_MODEL_TEMPERATURE: "0"
      E14_REASONING_EFFORT: medium
      E14_REASONING_FORMAT: hidden
      E14_RESPONSE_FORMAT_MODE: json_schema_strict
      E14_MAX_COMPLETION_TOKENS: "4096"
      # Structural dry-run skips pacing sleeps. Real E14l is still asserted at 25s by the runner.
      E8_BETWEEN_CALL_DELAY_SECONDS: "0"
      E14F_REPAIR_DELAY_SECONDS: "0"
      E14_MAX_RETRIES: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate frozen strict public schema
        run: PYTHONPATH=. python scripts/research/e14j_strict_output_schema.py
      - name: Execute E14l DEV-only structural dry-run
        run: >-
          PYTHONPATH=. python scripts/research/e14l_dev_only_120b_medium_reasoning_strict_4096.py
          --manifest research/experiments/e14l-dev-only-120b-medium-reasoning-strict-4096-manifest.json
          --split-manifest research/frozen/benchmark-split-v1.json
          --out /tmp/e14l-dev-only-medium-reasoning-dry-run.json
          --dry-run
      - name: Upload E14l dry-run summary
        uses: actions/upload-artifact@v4
        with:
          name: e14l-dev-only-medium-reasoning-strict-4096-dry-run
          path: /tmp/e14l-dev-only-medium-reasoning-dry-run.json
