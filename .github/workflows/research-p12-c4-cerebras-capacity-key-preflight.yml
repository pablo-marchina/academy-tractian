name: research-p12-c4-cerebras-capacity-key-preflight

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-p12-c4-cerebras-capacity-key-preflight.yml'

permissions:
  contents: read

env:
  MODEL_ID: gpt-oss-120b

jobs:
  authenticated-no-inference-preflight:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Assert credential is available
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          test -n "${CEREBRAS_API_KEY:-}"
      - name: Authenticated GET models only
        env:
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
        run: |
          set -euo pipefail
          status="$(curl --silent --show-error \
            --dump-header /tmp/cerebras-headers.txt \
            --output /tmp/cerebras-models.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${CEREBRAS_API_KEY}" \
            --header 'Accept: application/json' \
            https://api.cerebras.ai/v1/models)"
          printf '%s' "$status" > /tmp/cerebras-status.txt
          test "$status" = "200"
      - name: Build sanitized first-party evidence
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path

          status = Path('/tmp/cerebras-status.txt').read_text().strip()
          body = json.loads(Path('/tmp/cerebras-models.json').read_text(encoding='utf-8'))
          models = body.get('data') or []
          model_ids = sorted(str(x.get('id')) for x in models if isinstance(x, dict) and x.get('id'))
          if 'gpt-oss-120b' not in model_ids:
              raise SystemExit('gpt-oss-120b is not accessible to this API key')

          raw_headers = Path('/tmp/cerebras-headers.txt').read_text(encoding='utf-8', errors='replace').splitlines()
          headers = {}
          for line in raw_headers:
              if ':' not in line:
                  continue
              key, value = line.split(':', 1)
              key = key.strip().lower()
              if key.startswith('x-ratelimit-') or key in {'date', 'x-request-id', 'request-id'}:
                  headers[key] = value.strip()

          evidence = {
              'schema_version': 'p12-c4-cerebras-authenticated-capacity-key-preflight-v1',
              'status': 'PASS_AUTHENTICATED_NO_INFERENCE',
              'observed_at_utc': datetime.now(timezone.utc).isoformat(),
              'evidence_source': 'cerebras_authenticated_get_v1_models',
              'http_status': int(status),
              'credential_present': True,
              'credential_value_persisted': False,
              'model_id': 'gpt-oss-120b',
              'model_accessible': True,
              'accessible_model_ids': model_ids,
              'authenticated_api_requests': 1,
              'inference_requests': 0,
              'chat_completion_requests': 0,
              'generation_tokens_consumed': 0,
              'response_headers_sanitized': headers,
              'attestation_pass_claimed': False,
              'reason_attestation_not_auto_claimed': 'authenticated API access and observed headers are evidence, but missing quota dimensions must not be inferred',
          }
          Path('/tmp/p12-c4-cerebras-capacity-key-preflight.json').write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, indent=2, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p12-c4-cerebras-capacity-key-preflight
          path: /tmp/p12-c4-cerebras-capacity-key-preflight.json
          retention-days: 90
          if-no-files-found: error
