name: observability-api-provider-free

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  observability-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Safe observability, realtime, architecture, analytics, operability and product API contract tests
        run: >-
          python -m pytest -q
          tests/test_observability.py
          tests/test_observability_store.py
          tests/test_observability_api.py
          tests/test_architecture_manifest.py
          tests/test_architecture_api.py
          tests/test_operational_read_model_api.py
          tests/test_realtime_observability.py
          tests/test_observability_sse.py
          tests/test_product_api.py
          tests/test_production_operability.py
      - name: Compile production observability, analytics, architecture, controls, telemetry and product modules
        run: >-
          python -m py_compile
          src/academy_tractian/observability.py
          src/academy_tractian/observability_store.py
          src/academy_tractian/observability_api.py
          src/academy_tractian/operational_read_model.py
          src/academy_tractian/provider_experiments.py
          src/academy_tractian/architecture_manifest.py
          src/academy_tractian/production_controls.py
          src/academy_tractian/production_telemetry.py
          src/academy_tractian/realtime_observability.py
          src/academy_tractian/realtime_runtime.py
          src/academy_tractian/product_api.py
