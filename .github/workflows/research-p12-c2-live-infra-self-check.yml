name: research-p12-c2-live-infra-self-check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-p12-c2-live-infra-self-check.yml'
      - '.github/workflows/research-p12-c2-factorial-exposed-pool.yml'
      - 'research/experiments/p12-c2-factorial-exposed-pool-execution-v1.json'
      - 'scripts/research/p12_c2_factorial_score.py'

permissions:
  contents: read

env:
  PYTHONPATH: .
  ACTIVATION: research/experiments/p12-c2-exposed-pool-activation-eligibility-v1.json
  PARENT_BUNDLE: research/execution-bundles/p12-c1/p12_c1_paired_exposed_pool_execution.py.gz
  EXPOSED_CASES: research/fixtures/p12-c1-exposed-agent-input-cases-v1.json

jobs:
  validate-live-infrastructure-provider-free:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install 'pydantic>=2,<3'
      - name: Freeze exact scorer identity and compile
        run: |
          git hash-object scripts/research/p12_c2_factorial_score.py | grep -Fx 'dc20be4896ff023989ee6deb012ad440c39ec531'
          echo "P12_C2_FACTORIAL_SCORER_SHA256=$(sha256sum scripts/research/p12_c2_factorial_score.py | cut -d' ' -f1)"
          python -m py_compile scripts/research/p12_c2_factorial_score.py
      - name: Validate frozen guards and derive runner
        run: |
          test -z "${GROQ_API_KEY:-}"
          python scripts/research/big_b4_protocol_guard.py
          python scripts/research/p12_c2_activation_self_check.py >/tmp/activation.json
          git hash-object "$PARENT_BUNDLE" | grep -Fx 'a5c27394014bac656faa0a2f923a5c5da72d66f5'
          python scripts/research/p12_c2_execution_derivation.py --parent-gz "$PARENT_BUNDLE" --out scripts/research/p12_c2_factorial_execution.py
          echo 'f494eeac56d69cee85609e79d383b150ccc9e1a51a6e2bf61913bf07cef84d59  scripts/research/p12_c2_factorial_execution.py' | sha256sum -c -
      - name: Validate public corpus and private boundary
        run: |
          mkdir -p agent-input
          cp "$EXPOSED_CASES" agent-input/cases.json
          echo 'a7f9bdf909820d1a3c42c85bc1b659b6708ee74980958b5d8d738395a636f9ef  agent-input/cases.json' | sha256sum -c -
          rm -f eval/expected-paths.json private-eval/expected-paths.json docs/test-scenarios.md eval/test-scenarios.md
          test ! -e eval/expected-paths.json
          test ! -e private-eval/expected-paths.json
      - name: Full 36-parent 144-output provider-free dry execution
        env:
          E8_GROQ_MODEL: openai/gpt-oss-120b
          E8_MODEL_TEMPERATURE: '0'
          E14_REASONING_EFFORT: medium
          E14_REASONING_FORMAT: hidden
          E14_RESPONSE_FORMAT_MODE: json_schema_strict
          E14_MAX_COMPLETION_TOKENS: '4096'
          E14_MAX_RETRIES: '2'
          E8_BETWEEN_CALL_DELAY_SECONDS: '0'
          E14F_REPAIR_DELAY_SECONDS: '0'
        run: |
          python scripts/research/p12_c2_factorial_execution.py --activation "$ACTIVATION" --fixed-outputs /tmp/fixed.json --generation-summary /tmp/generation.json --dry-run
          python - <<'PY'
          import json
          f=json.load(open('/tmp/fixed.json')); g=json.load(open('/tmp/generation.json'))
          assert f['status']=='P12_C2_FIXED_FACTORIAL_OUTPUTS_PASS'
          assert f['common_parent_count']==36 and f['fixed_arm_output_count']==144 and len(f['calls'])==144
          assert f['fixed_before_private_scoring'] is True
          assert f['candidate_private_oracle_accesses']==0
          assert f['fresh_blind_accesses']==0 and f['legacy_locked_test_accesses']==0
          assert f['arm_specific_provider_calls']==0
          assert g['successful_common_parent_generations']==36 and g['fixed_arm_outputs']==144
          print('P12_C2_LIVE_INFRA_DRY_PASS')
          PY
