name: action-execution-lease

on:
  pull_request:
    paths:
      - "src/academy_tractian/action_execution_lease.py"
      - "src/academy_tractian/action_product_api.py"
      - "src/academy_tractian/action_recovery.py"
      - "src/academy_tractian/postgres_action_execution_lease.py"
      - "src/academy_tractian/postgres_action_operational.py"
      - "src/academy_tractian/postgres_product_api.py"
      - "tests/test_postgres_action_execution_lease.py"
      - ".github/workflows/action-execution-lease.yml"
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-action-lease:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_tractian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_tractian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_OPERATIONAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/academy_tractian
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Prove non-transferable action lease and stale-result fencing
        run: python -m pytest -q tests/test_postgres_action_execution_lease.py

      - name: Regress consequential action safety and restart semantics
        run: >-
          python -m pytest -q
          tests/test_postgres_product_api.py
          tests/test_action_product_api.py
          tests/test_action_recovery.py

      - name: Verify promoted action lease imports
        run: |
          python - <<'PY'
          from academy_tractian.action_execution_lease import (
              ActionExecutionLeaseGuard,
              ActionExecutionLeaseSupervisor,
          )
          from academy_tractian.postgres_action_execution_lease import (
              PostgresActionExecutionLeaseStore,
          )
          from academy_tractian.postgres_product_api import (
              create_postgres_action_capable_product_app,
          )
          assert ActionExecutionLeaseGuard is not None
          assert ActionExecutionLeaseSupervisor is not None
          assert PostgresActionExecutionLeaseStore is not None
          assert callable(create_postgres_action_capable_product_app)
          print("ACTION_EXECUTION_LEASE_IMPORTS=PASS")
          PY
