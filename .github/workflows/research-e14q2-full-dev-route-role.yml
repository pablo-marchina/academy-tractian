name: research-e14q2-full-dev-route-role

on:
  push:
    branches: [research/systematic-foundation]
    paths:
      - 'research/experiments/e14q2-full-dev-public-route-role-purpose-consistency-preregistration.json'
      - 'scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard.py'
      - 'scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard_selfcheck.py'
      - '.github/workflows/research-e14q2-full-dev-route-role.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/experiments/e14q2-full-dev-public-route-role-purpose-consistency-preregistration.json'
      - 'scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard.py'
      - 'scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard_selfcheck.py'
      - '.github/workflows/research-e14q2-full-dev-route-role.yml'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public registry dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Compile
        run: |
          python -m py_compile scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard.py
          python -m py_compile scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard_selfcheck.py
      - name: Run public synthetic self-check
        env:
          PYTHONPATH: .
        run: python scripts/research/e14q2_full_dev_public_route_role_purpose_consistency_guard_selfcheck.py
      - name: Verify preregistration constants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('research/experiments/e14q2-full-dev-public-route-role-purpose-consistency-preregistration.json')
          x=json.loads(p.read_text())
          assert x['status']=='PREREGISTERED_AFTER_E14Q_AGGREGATE_AND_BEFORE_E14Q2_TRANSFORM'
          g=x['E14q2_target_gate']
          assert g['fixed_calls_required']==10
          assert g['scoreable_calls_required']==10
          assert g['premature_action_rate_required']==0.0
          assert g['unsupported_action_or_escalation_rate_required']==0.0
          assert g['decision_correctness_min']==0.7
          assert g['action_correctness_min']==0.8
          assert g['escalation_correctness_min']==0.7
          assert g['evidence_correctness_expected_unchanged']==0.2
          assert g['mean_expected_read_recall_expected_unchanged']==0.7667
          assert g['mean_extra_public_read_count_expected_unchanged']==3.5
          PY
