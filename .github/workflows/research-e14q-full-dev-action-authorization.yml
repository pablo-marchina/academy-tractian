name: research-e14q-full-dev-action-authorization

on:
  push:
    branches: [research/systematic-foundation]
    paths:
      - 'research/experiments/e14q-full-dev-public-action-authorization-consistency-preregistration.json'
      - 'scripts/research/e14q_full_dev_public_action_authorization_consistency_guard.py'
      - 'scripts/research/e14q_full_dev_public_action_authorization_consistency_guard_selfcheck.py'
      - '.github/workflows/research-e14q-full-dev-action-authorization.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/experiments/e14q-full-dev-public-action-authorization-consistency-preregistration.json'
      - 'scripts/research/e14q_full_dev_public_action_authorization_consistency_guard.py'
      - 'scripts/research/e14q_full_dev_public_action_authorization_consistency_guard_selfcheck.py'
      - '.github/workflows/research-e14q-full-dev-action-authorization.yml'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public registry dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Compile
        run: |
          python -m py_compile scripts/research/e14q_full_dev_public_action_authorization_consistency_guard.py
          python -m py_compile scripts/research/e14q_full_dev_public_action_authorization_consistency_guard_selfcheck.py
      - name: Run synthetic public-only self-check
        env:
          PYTHONPATH: .
        run: python scripts/research/e14q_full_dev_public_action_authorization_consistency_guard_selfcheck.py
      - name: Verify preregistration constants
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('research/experiments/e14q-full-dev-public-action-authorization-consistency-preregistration.json').read_text())
          assert p['status'] == 'PREREGISTERED_AFTER_E14P_FULL_DEV_REJECTION_AND_BEFORE_E14Q_TRANSFORM'
          assert p['intervention_class'] == 'deterministic_public_action_authorization_state_consistency_only'
          assert p['paired_invariants']['provider_calls'] == 0
          assert p['paired_invariants']['evidence_plan_byte_for_byte'] is True
          assert p['E14q_target_gate']['premature_action_rate_required'] == 0.0
          assert p['E14q_target_gate']['unsupported_action_or_escalation_rate_required'] == 0.0
          assert p['interpretation_limits']['E14q_pass_can_authorize_VALIDATION'] is False
          PY
