name: final-ci-required

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  clean-clone:
    name: clean-clone
    uses: ./.github/workflows/clean-clone-full-product-reproduction.yml

  full-product-browser:
    name: full-product-browser
    uses: ./.github/workflows/full-product-playwright.yml

  horizontal-runtime-handoff:
    name: horizontal-runtime-handoff
    uses: ./.github/workflows/horizontal-runtime-handoff.yml

  action-execution-lease:
    name: action-execution-lease
    uses: ./.github/workflows/action-execution-lease.yml

  railway-iac-contract:
    name: railway-iac-contract
    uses: ./.github/workflows/railway-iac-contract.yml

  production-runtime:
    name: production-runtime
    uses: ./.github/workflows/production-runtime.yml

  required-gate:
    name: required-gate
    if: ${{ always() }}
    needs:
      - clean-clone
      - full-product-browser
      - horizontal-runtime-handoff
      - action-execution-lease
      - railway-iac-contract
      - production-runtime
    runs-on: ubuntu-latest
    steps:
      - name: Require all final production regression contracts
        env:
          CLEAN_CLONE_RESULT: ${{ needs.clean-clone.result }}
          FULL_PRODUCT_BROWSER_RESULT: ${{ needs.full-product-browser.result }}
          HORIZONTAL_RUNTIME_RESULT: ${{ needs.horizontal-runtime-handoff.result }}
          ACTION_EXECUTION_LEASE_RESULT: ${{ needs.action-execution-lease.result }}
          RAILWAY_IAC_RESULT: ${{ needs.railway-iac-contract.result }}
          PRODUCTION_RUNTIME_RESULT: ${{ needs.production-runtime.result }}
        run: |
          echo "clean-clone=${CLEAN_CLONE_RESULT}"
          echo "full-product-browser=${FULL_PRODUCT_BROWSER_RESULT}"
          echo "horizontal-runtime-handoff=${HORIZONTAL_RUNTIME_RESULT}"
          echo "action-execution-lease=${ACTION_EXECUTION_LEASE_RESULT}"
          echo "railway-iac-contract=${RAILWAY_IAC_RESULT}"
          echo "production-runtime=${PRODUCTION_RUNTIME_RESULT}"
          test "${CLEAN_CLONE_RESULT}" = "success"
          test "${FULL_PRODUCT_BROWSER_RESULT}" = "success"
          test "${HORIZONTAL_RUNTIME_RESULT}" = "success"
          test "${ACTION_EXECUTION_LEASE_RESULT}" = "success"
          test "${RAILWAY_IAC_RESULT}" = "success"
          test "${PRODUCTION_RUNTIME_RESULT}" = "success"
          echo "FINAL_REQUIRED_CI=PASS"
