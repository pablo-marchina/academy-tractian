name: research-p12-c4-nvidia-synthetic-live-probe

on:
  push:
    branches:
      - research/systematic-foundation
    paths:
      - "research/frozen/p12-c4-nvidia-synthetic-probe-live-authorization-v1.json"

permissions:
  contents: read

jobs:
  exactly-one-nvidia-synthetic-probe-attempt:
    runs-on: ubuntu-24.04
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Assert one-shot trigger and frozen artifacts
        run: |
          test "${GITHUB_RUN_ATTEMPT}" = "1"
          test -n "${NVIDIA_API_KEY:-}"
          test -f research/frozen/p12-c4-nvidia-synthetic-probe-live-authorization-v1.json
          test -f research/experiments/p12-c4-nvidia-provider-serving-contract-v1.json
          test -f research/experiments/p12-c4-nvidia-synthetic-compatibility-probe-preregistration-v1.json
          test -f research/frozen/p12-c4-nvidia-request-budget-and-pacing-v1.json
          test -f research/results/p12-c4-openrouter-synthetic-live-probe-closure-2026-08-26.json
      - name: Install exact frozen transport
        run: |
          python -m pip install --disable-pip-version-check 'httpx==0.28.1'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version("httpx")=="0.28.1"
          print("NVIDIA_HTTPX_PIN_PASS")
          PY
      - name: Compile live runner
        run: python -m py_compile scripts/research/p12_c4_nvidia_synthetic_probe.py
      - name: Validate one-shot authorization without provider call
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path("scripts/research/p12_c4_nvidia_synthetic_probe.py")
          s=importlib.util.spec_from_file_location("probe",p)
          m=importlib.util.module_from_spec(s); s.loader.exec_module(m)
          z=m.check_auth(Path("research/frozen/p12-c4-nvidia-synthetic-probe-live-authorization-v1.json"))
          assert z["authorized_attempts"]==1
          assert z["maximum_provider_request_attempts"]==2
          assert z["github_actions_run_attempt_required"]==1
          assert z["rerun_allowed"] is False
          assert z["automatic_retry_allowed"] is False
          assert z["provider_fallback_allowed"] is False
          assert z["model_fallback_allowed"] is False
          assert z["exposed_pool_live_generation_authorized"] is False
          assert z["full_packet_capacity_authorized"] is False
          print("P12_C4_NVIDIA_SYNTHETIC_LIVE_PREFLIGHT_PASS")
          PY
      - name: Execute at most two preregistered synthetic calls
        run: |
          python scripts/research/p12_c4_nvidia_synthetic_probe.py \
            --authorization research/frozen/p12-c4-nvidia-synthetic-probe-live-authorization-v1.json \
            --output /tmp/p12-c4-nvidia-synthetic-compatibility-probe-result.json
      - name: Require exact 2-of-2 semantic PASS
        run: |
          python - <<'PY'
          import json
          x=json.load(open("/tmp/p12-c4-nvidia-synthetic-compatibility-probe-result.json"))
          assert x["status"]=="PASS"
          assert x["provider_calls"]==2
          assert x["provider_request_attempts"]==2
          assert x["successful_http_responses"]==2
          assert x["model_outputs_observed"]==2
          assert x["automatic_retries"]==x["provider_fallbacks"]==x["model_fallbacks"]==0
          assert x["benchmark_inputs_loaded"]==x["private_oracle_accesses"]==x["fresh_blind_accesses"]==x["legacy_locked_test_accesses"]==0
          assert x["reasoning_content_persisted"] is False
          assert x["provider_account_identifiers_persisted"] is False
          assert x["exposed_pool_live_generation_authorized_by_this_result"] is False
          assert x["full_packet_capacity_authorized_by_this_result"] is False
          assert len(x["calls"])==2
          assert x["calls"][0]["semantic_validation"]=={"contract_marker":"P12-C4-NVIDIA-SYNTHETIC","ok":True}
          assert x["calls"][1]["semantic_validation"]["marker"]=="P12-C4-NVIDIA-TOOL"
          print("P12_C4_NVIDIA_SYNTHETIC_2_OF_2_PASS")
          PY
      - name: Upload immutable synthetic result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: p12-c4-nvidia-synthetic-compatibility-probe-result-v1
          path: /tmp/p12-c4-nvidia-synthetic-compatibility-probe-result.json
          if-no-files-found: warn
          retention-days: 90
