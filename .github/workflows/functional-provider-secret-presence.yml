name: functional-provider-secret-presence

on:
  push:
    branches:
      - fix/functional-acceptance-closure

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-24.04
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - name: Report presence only
        shell: bash
        run: |
          python - <<'PY'
          import json, os
          names = [
              "GEMINI_API_KEY",
              "GROQ_API_KEY",
              "NVIDIA_API_KEY",
              "OPENROUTER_API_KEY",
              "RAILWAY_TOKEN",
          ]
          print(json.dumps({
              "schema_version": "provider-secret-presence-v1",
              "present": {name: bool(os.environ.get(name, "").strip()) for name in names},
          }, sort_keys=True))
          PY
