name: functional-provider-secret-presence

on:
  push:
    branches:
      - fix/functional-acceptance-closure

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - name: Probe Groq without exposing secret
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          key = os.environ.get("GROQ_API_KEY", "").strip()
          if not key:
              raise SystemExit("GROQ_API_KEY missing")

          endpoint = "https://api.groq.com/openai/v1/chat/completions"
          headers = {
              "Authorization": f"Bearer {key}",
              "Content-Type": "application/json",
              "Accept": "application/json",
          }

          probes = [
              (
                  "basic",
                  {
                      "model": "openai/gpt-oss-120b",
                      "messages": [{"role": "user", "content": "Return exactly OK."}],
                      "temperature": 0,
                      "n": 1,
                      "stream": False,
                      "max_completion_tokens": 16,
                  },
              ),
              (
                  "structured",
                  {
                      "model": "openai/gpt-oss-120b",
                      "messages": [
                          {"role": "system", "content": "Return only the schema-conforming JSON."},
                          {"role": "user", "content": "Set ok to true."},
                      ],
                      "temperature": 0,
                      "n": 1,
                      "stream": False,
                      "max_completion_tokens": 64,
                      "response_format": {
                          "type": "json_schema",
                          "json_schema": {
                              "name": "probe",
                              "strict": True,
                              "schema": {
                                  "type": "object",
                                  "additionalProperties": False,
                                  "properties": {"ok": {"type": "boolean"}},
                                  "required": ["ok"],
                              },
                          },
                      },
                  },
              ),
          ]

          results = []
          for name, payload in probes:
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  headers=headers,
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      body = json.loads(response.read().decode("utf-8"))
                      results.append({
                          "probe": name,
                          "status": int(response.status),
                          "ok": 200 <= int(response.status) < 300,
                          "model": body.get("model") if isinstance(body, dict) else None,
                      })
              except urllib.error.HTTPError as exc:
                  error_code = None
                  try:
                      body = json.loads(exc.read().decode("utf-8"))
                      error = body.get("error") if isinstance(body, dict) else None
                      if isinstance(error, dict):
                          error_code = error.get("code") or error.get("type")
                  except Exception:
                      pass
                  results.append({"probe": name, "status": int(exc.code), "ok": False, "error_code": error_code})

          print(json.dumps({
              "schema_version": "groq-provider-probe-v1",
              "results": results,
              "credentials_recorded": False,
              "raw_provider_body_recorded": False,
          }, sort_keys=True))

          if not all(item["ok"] for item in results):
              raise SystemExit(2)
          PY

      - name: Export encrypted credential relay payload
        shell: bash
        run: |
          cat > /tmp/groq-relay-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsLg64AASRj68ktgJ440n
          lQeNCdnF4m2m9LBRf+g3hpg/dQLc2FN6XlxfCubWDqqdaiCzlTtClbGrtBnceD51
          lmeaLcMJClNrvuKcjPkf0pPIqhpNQvv2EF19EawaBRXcljHYd+ppNFSrjDBcGAt4
          iANQjPkSTxe/MafyszleeyWIAPqGX2AjbyRUyRMIb/cHx3Y/a16JEcxxUCEo6HWf
          7r/rl7szRH5EXfaLR71FJjeRwA+uQ3K/AYdJuR7R8p3PQdFFGTApQXXLN99NZf40
          c95y3P2i2kCuHpdxbStOrG/QNIDSOB6/ULuwqXToSTl3yZligM0olLlELefhY9xw
          9QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          printf '%s' "$GROQ_API_KEY" > /tmp/groq-key.txt
          openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/groq-relay-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/groq-key.txt -out /tmp/groq-key.enc
          printf 'GROQ_RELAY_RSA_OAEP_SHA256=' && base64 -w0 /tmp/groq-key.enc && printf '\n'
          rm -f /tmp/groq-key.txt /tmp/groq-key.enc /tmp/groq-relay-public.pem
