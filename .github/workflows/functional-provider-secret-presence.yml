name: functional-provider-secret-presence

on:
  push:
    branches:
      - fix/functional-acceptance-closure

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-24.04
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Probe zero-cash provider candidates and choose first eligible direct route
        shell: bash
        run: |
          python - <<'PY'
          import json, os, pathlib, urllib.error, urllib.request

          candidates = [
              {
                  "provider": "nvidia",
                  "key": os.environ.get("NVIDIA_API_KEY", "").strip(),
                  "endpoint": "https://integrate.api.nvidia.com/v1/chat/completions",
                  "model": "openai/gpt-oss-120b",
              },
              {
                  "provider": "groq",
                  "key": os.environ.get("GROQ_API_KEY", "").strip(),
                  "endpoint": "https://api.groq.com/openai/v1/chat/completions",
                  "model": "openai/gpt-oss-120b",
              },
              {
                  "provider": "openrouter",
                  "key": os.environ.get("OPENROUTER_API_KEY", "").strip(),
                  "endpoint": "https://openrouter.ai/api/v1/chat/completions",
                  "model": "openai/gpt-oss-120b:free",
              },
          ]

          schema = {
              "type": "object",
              "additionalProperties": False,
              "properties": {"ok": {"type": "boolean"}},
              "required": ["ok"],
          }

          def probe(candidate, structured):
              payload = {
                  "model": candidate["model"],
                  "messages": [
                      {"role": "system", "content": "Return only the requested output."},
                      {"role": "user", "content": "Set ok to true." if structured else "Return exactly OK."},
                  ],
                  "temperature": 0,
                  "stream": False,
                  "max_tokens": 64 if structured else 16,
              }
              if structured:
                  payload["response_format"] = {
                      "type": "json_schema",
                      "json_schema": {"name": "probe", "strict": True, "schema": schema},
                  }
              if candidate["provider"] == "openrouter":
                  payload["provider"] = {"allow_fallbacks": False, "require_parameters": True}
              request = urllib.request.Request(
                  candidate["endpoint"],
                  data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {candidate['key']}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      body = json.loads(response.read().decode("utf-8", "replace"))
                      return {
                          "status": int(response.status),
                          "ok": 200 <= int(response.status) < 300,
                          "model": body.get("model") if isinstance(body, dict) else None,
                      }
              except urllib.error.HTTPError as exc:
                  error_code = None
                  try:
                      body = json.loads(exc.read().decode("utf-8", "replace"))
                      error = body.get("error") if isinstance(body, dict) else None
                      if isinstance(error, dict):
                          error_code = error.get("code") or error.get("type")
                  except Exception:
                      pass
                  return {"status": int(exc.code), "ok": False, "error_code": error_code}
              except Exception as exc:
                  return {"status": None, "ok": False, "transport": type(exc).__name__}

          summaries = []
          selected = None
          for candidate in candidates:
              if not candidate["key"]:
                  summaries.append({"provider": candidate["provider"], "present": False, "eligible": False})
                  continue
              basic = probe(candidate, False)
              structured = probe(candidate, True)
              eligible = bool(basic.get("ok") and structured.get("ok"))
              summaries.append({
                  "provider": candidate["provider"],
                  "present": True,
                  "eligible": eligible,
                  "basic": basic,
                  "structured": structured,
              })
              if selected is None and eligible:
                  selected = candidate

          print(json.dumps({
              "schema_version": "zero-cash-provider-eligibility-v1",
              "results": summaries,
              "selected_provider": selected["provider"] if selected else None,
              "selected_model": selected["model"] if selected else None,
              "credentials_recorded": False,
              "raw_provider_body_recorded": False,
          }, sort_keys=True))

          if selected is None:
              raise SystemExit(2)
          pathlib.Path("/tmp/selected-provider.txt").write_text(selected["provider"] + "\n" + selected["model"], encoding="utf-8")
          pathlib.Path("/tmp/selected-key.txt").write_text(selected["key"], encoding="utf-8")
          PY

      - name: Export selected credential as RSA-OAEP ciphertext only
        shell: bash
        run: |
          cat > /tmp/provider-relay-public.pem <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAsLg64AASRj68ktgJ440n
          lQeNCdnF4m2m9LBRf+g3hpg/dQLc2FN6XlxfCubWDqqdaiCzlTtClbGrtBnceD51
          lmeaLcMJClNrvuKcjPkf0pPIqhpNQvv2EF19EawaBRXcljHYd+ppNFSrjDBcGAt4
          iANQjPkSTxe/MafyszleeyWIAPqGX2AjbyRUyRMIb/cHx3Y/a16JEcxxUCEo6HWf
          7r/rl7szRH5EXfaLR71FJjeRwA+uQ3K/AYdJuR7R8p3PQdFFGTApQXXLN99NZf40
          c95y3P2i2kCuHpdxbStOrG/QNIDSOB6/ULuwqXToSTl3yZligM0olLlELefhY9xw
          9QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          openssl pkeyutl -encrypt \
            -pubin -inkey /tmp/provider-relay-public.pem \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256 \
            -in /tmp/selected-key.txt -out /tmp/selected-key.enc
          printf 'SELECTED_PROVIDER=' && head -n1 /tmp/selected-provider.txt
          printf 'SELECTED_MODEL=' && tail -n1 /tmp/selected-provider.txt
          printf 'PROVIDER_RELAY_RSA_OAEP_SHA256=' && base64 -w0 /tmp/selected-key.enc && printf '\n'
          rm -f /tmp/selected-key.txt /tmp/selected-key.enc /tmp/provider-relay-public.pem
