name: functional-provider-secret-presence

on:
  push:
    branches:
      - fix/functional-acceptance-closure

permissions:
  contents: read

jobs:
  presence:
    runs-on: ubuntu-24.04
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - name: Probe current zero-cash OpenRouter routes
        shell: bash
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request

          key = os.environ.get("OPENROUTER_API_KEY", "").strip()
          if not key:
              raise SystemExit("OPENROUTER_API_KEY missing")

          endpoint = "https://openrouter.ai/api/v1/chat/completions"
          candidates = [
              "nvidia/nemotron-3-super-120b-a12b:free",
              "openrouter/free",
          ]
          schema = {
              "type": "object",
              "additionalProperties": False,
              "properties": {"ok": {"type": "boolean"}},
              "required": ["ok"],
          }

          def call(model, structured):
              payload = {
                  "model": model,
                  "messages": [
                      {"role": "system", "content": "Return only the requested output."},
                      {"role": "user", "content": "Set ok to true." if structured else "Return exactly OK."},
                  ],
                  "temperature": 0,
                  "stream": False,
                  "max_tokens": 64 if structured else 16,
              }
              if structured:
                  payload["response_format"] = {
                      "type": "json_schema",
                      "json_schema": {"name": "probe", "strict": True, "schema": schema},
                  }
              request = urllib.request.Request(
                  endpoint,
                  data=json.dumps(payload, separators=(",", ":")).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )
              try:
                  with urllib.request.urlopen(request, timeout=45) as response:
                      body = json.loads(response.read().decode("utf-8", "replace"))
                      return {
                          "status": int(response.status),
                          "ok": 200 <= int(response.status) < 300,
                          "served_model": body.get("model") if isinstance(body, dict) else None,
                      }
              except urllib.error.HTTPError as exc:
                  error_code = None
                  try:
                      body = json.loads(exc.read().decode("utf-8", "replace"))
                      error = body.get("error") if isinstance(body, dict) else None
                      if isinstance(error, dict):
                          error_code = error.get("code") or error.get("type")
                  except Exception:
                      pass
                  return {"status": int(exc.code), "ok": False, "error_code": error_code}
              except Exception as exc:
                  return {"status": None, "ok": False, "transport": type(exc).__name__}

          results = []
          selected = None
          for model in candidates:
              basic = call(model, False)
              structured = call(model, True)
              eligible = bool(basic.get("ok") and structured.get("ok"))
              results.append({
                  "model": model,
                  "eligible": eligible,
                  "basic": basic,
                  "structured": structured,
              })
              if selected is None and eligible:
                  selected = model

          print(json.dumps({
              "schema_version": "openrouter-zero-cash-eligibility-v2",
              "results": results,
              "selected_provider": "openrouter" if selected else None,
              "selected_model": selected,
              "credentials_recorded": False,
              "raw_provider_body_recorded": False,
          }, sort_keys=True))

          if selected is None:
              raise SystemExit(2)
          PY
