name: nvidia-v15-validation

on:
  push:
    branches:
      - v15-nvidia-serving-20260908
    paths:
      - ".github/workflows/nvidia-v15-validation.yml"

permissions:
  contents: read

jobs:
  validate-v15:
    runs-on: ubuntu-24.04
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      BASE_SHA: 5bba4b94724a35837c8f18c27e0f331e4a31bedd
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project test dependencies
        run: python -m pip install --disable-pip-version-check -e '.[dev]'
      - name: Compile V15 surfaces
        run: |
          python -m py_compile \
            src/academy_tractian/release_provider_v15.py \
            src/academy_tractian/remote_server.py \
            scripts/nvidia_v15_serving_probe.py \
            scripts/nvidia_v15_composition_smoke.py
      - name: Run V15 and preserved-V14 unit tests
        run: |
          python -m pytest -q \
            tests/test_release_provider_v15.py \
            tests/test_remote_server_v15.py \
            tests/test_release_provider_v14_length.py
      - name: Prove additive diff and frozen V14 generic transport
        run: |
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          test -z "$(git diff --name-only "${BASE_SHA}" HEAD -- src/academy_tractian/release_provider_v14.py)"
          test -z "$(git diff --name-only "${BASE_SHA}" HEAD -- src/academy_tractian/provider_clients.py)"
          test -z "$(git diff --name-only "${BASE_SHA}" HEAD -- src/academy_tractian/decision_source.py)"
          python - <<'PY'
          import os, subprocess
          base=os.environ['BASE_SHA']
          allowed={
            '.github/workflows/nvidia-v15-serving-probe.yml',
            '.github/workflows/nvidia-v15-validation.yml',
            'scripts/nvidia_v15_composition_smoke.py',
            'scripts/nvidia_v15_serving_probe.py',
            'src/academy_tractian/release_provider_v15.py',
            'src/academy_tractian/remote_server.py',
            'tests/test_release_provider_v15.py',
            'tests/test_remote_server_v15.py',
          }
          changed=set(subprocess.check_output(['git','diff','--name-only',base,'HEAD'],text=True).splitlines())
          unexpected=changed-allowed
          assert not unexpected, f'unexpected V15 changes: {sorted(unexpected)}'
          assert 'src/academy_tractian/release_provider_v15.py' in changed
          assert 'src/academy_tractian/remote_server.py' in changed
          print('V15_ADDITIVE_DIFF_PASS')
          print('OFFICIAL_CASE_ARTIFACTS_CHANGED=0')
          PY
      - name: Assert hosted NVIDIA secret exists
        run: test -n "${NVIDIA_API_KEY:-}"
      - name: Execute one-call composition-root serving smoke
        run: |
          python scripts/nvidia_v15_composition_smoke.py | tee /tmp/nvidia-v15-composition-smoke.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/nvidia-v15-composition-smoke.json'))
          assert x['status']=='PASS'
          assert x['model_id']=='openai/gpt-oss-20b'
          assert x['composition_root']=='academy_tractian.remote_server._decision_source_factory'
          assert x['provider_calls']==1
          assert x['official_cases_loaded']==0
          assert x['official_cases_consumed']==0
          assert x['raw_response_body_persisted'] is False
          assert x['credential_persisted'] is False
          print('NVIDIA_V15_COMPOSITION_SERVING_SMOKE_PASS')
          PY
      - name: Upload sanitized V15 smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nvidia-v15-composition-serving-smoke
          path: /tmp/nvidia-v15-composition-smoke.json
          if-no-files-found: warn
          retention-days: 30
