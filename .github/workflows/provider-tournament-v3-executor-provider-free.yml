name: provider-tournament-v3-executor-provider-free

on:
  pull_request:
    paths:
      - "src/academy_tractian/provider_tournament_v3.py"
      - "tests/test_provider_tournament_v3.py"
      - "scripts/research/validate_provider_tournament_v3.py"
      - "research/experiments/provider-tournament-v3-manifest.json"
      - "research/experiments/provider-tournament-v3-population.json"
      - ".github/workflows/provider-tournament-v3-executor-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Prove provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${ACADEMY_PROVIDER_API_TOKEN:-}"
          test -z "${ACADEMY_PROVIDER_ACCOUNT_ID:-}"
      - name: Compile executor
        run: python -m py_compile src/academy_tractian/provider_tournament_v3.py
      - name: Validate frozen preregistration
        run: python scripts/research/validate_provider_tournament_v3.py
      - name: Run v3 provider-free tests
        run: pytest -q tests/test_provider_tournament_v3.py
      - name: Preserve Cloudflare client and provenance regressions
        run: pytest -q tests/test_cloudflare_provider_client.py tests/test_cloudflare_provider_provenance_v2.py
