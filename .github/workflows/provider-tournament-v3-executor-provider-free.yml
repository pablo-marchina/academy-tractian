name: provider-tournament-v3-executor-provider-free

on:
  pull_request:
    paths:
      - "src/academy_tractian/provider_tournament_v3.py"
      - "src/academy_tractian/provider_tournament_v3_analysis.py"
      - "src/academy_tractian/provider_budget_gate.py"
      - "src/academy_tractian/provider_budget_transport.py"
      - "src/academy_tractian/cloudflare_workers_plan_probe.py"
      - "src/academy_tractian/release_provider_v13.py"
      - "scripts/research/run_provider_tournament_v3_scheduled_packet.py"
      - "scripts/research/validate_provider_tournament_v3.py"
      - "tests/test_provider_tournament_v3.py"
      - "tests/test_provider_tournament_v3_governance.py"
      - "research/experiments/provider-tournament-v3-manifest.json"
      - "research/experiments/provider-tournament-v3-population.json"
      - "research/experiments/provider-tournament-v3-selection-rule-amendment-v1.json"
      - "research/experiments/provider-tournament-v3-live-authorization-v1.json"
      - ".github/workflows/provider-tournament-v3-executor-provider-free.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Prove provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${ACADEMY_PROVIDER_API_TOKEN:-}"
          test -z "${ACADEMY_PROVIDER_ACCOUNT_ID:-}"
      - name: Compile governed v3 implementation
        run: |
          python -m py_compile \
            src/academy_tractian/provider_tournament_v3.py \
            src/academy_tractian/provider_tournament_v3_analysis.py \
            src/academy_tractian/provider_budget_gate.py \
            src/academy_tractian/provider_budget_transport.py \
            src/academy_tractian/cloudflare_workers_plan_probe.py \
            src/academy_tractian/release_provider_v13.py \
            scripts/research/run_provider_tournament_v3_scheduled_packet.py
      - name: Validate frozen preregistration
        run: python scripts/research/validate_provider_tournament_v3.py
      - name: Run v3 provider-free tests
        run: pytest -q tests/test_provider_tournament_v3.py tests/test_provider_tournament_v3_governance.py
      - name: Preserve Cloudflare and Release 0 regressions
        run: |
          pytest -q \
            tests/test_cloudflare_provider_client.py \
            tests/test_cloudflare_provider_provenance_v2.py \
            tests/test_release0_initial_grounding_v13.py
