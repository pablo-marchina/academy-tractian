name: final-delivery-provider-free-reproduction

on:
  pull_request:
    paths:
      - "src/academy_tractian/**"
      - "tests/**"
      - "scripts/**"
      - "research/e2/**"
      - "research/frozen/**"
      - "research/results/**"
      - "docs/adr/**"
      - ".github/workflows/final-delivery-provider-free-reproduction.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and E2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Run production runtime tests
        run: python -m pytest -q tests

      - name: Regress accepted ADR-004 controller boundary
        run: python -m pytest -q research/e2/tests/test_controller.py

      - name: Reproduce frozen EV-007
        run: python scripts/validate_ev007_failure_campaign.py

      - name: Reproduce frozen EV-008
        run: python scripts/validate_ev008_stability_campaign.py

      - name: Reproduce frozen EV-011
        run: python scripts/validate_ev011_communication_campaign.py

      - name: Validate final-delivery provider-free demo
        run: python scripts/validate_delivery_reproduction.py
