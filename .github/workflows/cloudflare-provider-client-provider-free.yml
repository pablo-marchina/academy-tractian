name: cloudflare-provider-client-provider-free

on:
  pull_request:
    paths:
      - src/academy_tractian/cloudflare_provider_client.py
      - tests/test_cloudflare_provider_client.py
      - src/academy_tractian/provider_clients.py
      - src/academy_tractian/decision_source.py
      - research/experiments/provider-model-comparison-design-manifest-v2.json
      - docs/adr/018-cloudflare-provider-model-comparison-preregistration-2026-08-31.md
      - .github/workflows/cloudflare-provider-client-provider-free.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-provider-free-cloudflare-client:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ensure provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
      - name: Validate frozen ADR-018 preregistration
        run: python scripts/research/validate_provider_model_comparison_design_v2.py
      - name: Run Cloudflare client provider-free tests
        run: python -m pytest -q tests/test_cloudflare_provider_client.py
      - name: Preserve historical provider client regressions
        run: python -m pytest -q tests/test_provider_clients.py tests/test_decision_source.py
