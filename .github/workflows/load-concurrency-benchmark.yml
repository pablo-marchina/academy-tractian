name: load-concurrency-benchmark

on:
  pull_request:
    paths:
      - "src/academy_tractian/load_concurrency_benchmark.py"
      - "src/academy_tractian/authenticated_postgres_product_api.py"
      - "src/academy_tractian/runtime_identity.py"
      - "src/academy_tractian/postgres_*.py"
      - "src/academy_tractian/product_api.py"
      - "src/academy_tractian/production_telemetry.py"
      - "scripts/load_concurrency_benchmark.py"
      - "tests/test_load_concurrency_benchmark.py"
      - "tests/test_postgres_load_concurrency_benchmark.py"
      - "research/load-concurrency-protocol-dev-v1.json"
      - ".github/workflows/load-concurrency-benchmark.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  load-concurrency-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_tractian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_tractian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_OPERATIONAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/academy_tractian
      LOAD_BENCHMARK_OUTPUT: load-concurrency-ci-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Run aggregate contract tests
        run: python -m pytest -q tests/test_load_concurrency_benchmark.py
      - name: Run authenticated PostgreSQL concurrency campaign
        run: python -m pytest -q tests/test_postgres_load_concurrency_benchmark.py
      - name: Compile external benchmark CLI
        run: python -m py_compile scripts/load_concurrency_benchmark.py
      - name: Verify installed benchmark imports
        run: |
          python - <<'PY'
          from academy_tractian.load_concurrency_benchmark import (
              LoadBenchmarkProtocol,
              analyze_load_benchmark,
          )
          assert LoadBenchmarkProtocol is not None
          assert callable(analyze_load_benchmark)
          print("load concurrency benchmark imports passed")
          PY
      - name: Publish aggregate benchmark evidence
        uses: actions/upload-artifact@v4
        with:
          name: load-concurrency-ci-report
          path: load-concurrency-ci-report.json
          if-no-files-found: error
          retention-days: 30
