name: provider-v5-contract-proof

on:
  pull_request:
    branches:
      - experiment/provider-tournament-final-20260908

permissions:
  contents: read

jobs:
  action-request-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]" "PyYAML>=6,<7"
      - name: Execute verified ActionRequest proof
        id: proof
        shell: bash
        run: |
          set +e
          python -m pytest -q -s tests/test_provider_v5_contract_proof.py > provider-v5-proof.log 2>&1
          code=$?
          cat provider-v5-proof.log
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload proof diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-v5-contract-proof-diagnostics
          path: provider-v5-proof.log
          if-no-files-found: error
          retention-days: 1
      - name: Enforce proof success
        if: always()
        shell: bash
        run: |
          test "${{ steps.proof.outputs.exit_code }}" = "0"
