name: provider-v5-contract-proof

on:
  pull_request:
    branches:
      - experiment/provider-tournament-final-20260908

permissions:
  contents: read

jobs:
  action-request-proof:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install proof dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]" "PyYAML>=6,<7"
      - name: Prove verified ActionRequest contract
        run: python -m pytest -q -s tests/test_provider_v5_contract_proof.py
