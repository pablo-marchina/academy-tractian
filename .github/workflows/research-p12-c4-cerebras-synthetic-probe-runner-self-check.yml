name: research-p12-c4-cerebras-synthetic-probe-runner-self-check

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-p12-c4-cerebras-synthetic-probe-runner-self-check.yml'
      - 'scripts/research/p12_c4_cerebras_synthetic_probe.py'
      - 'research/experiments/p12-c4-cerebras-synthetic-compatibility-probe-preregistration-v1.json'
      - 'research/experiments/p12-c4-provider-serving-contract-v1.json'
      - 'research/experiments/p12-c4-cerebras-account-capacity-attestation-schema-v2.json'
      - 'research/frozen/p12-c4-prompt-budget-and-pacing-v1.json'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  provider-free-probe-runner-self-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert no provider/private/blind inputs
        run: |
          test -z "${CEREBRAS_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
          test ! -e eval/expected-paths.json
          test ! -e private-eval/expected-paths.json
          test ! -e research/experiments/p12-c4-cerebras-account-capacity-attestation-v2.json
          test ! -e research/frozen/p12-c4-cerebras-synthetic-probe-live-authorization-v1.json
      - name: Static isolation scan
        run: |
          ! grep -q 'p12-c1-exposed-agent-input-cases' scripts/research/p12_c4_cerebras_synthetic_probe.py
          ! grep -q 'expected-paths' scripts/research/p12_c4_cerebras_synthetic_probe.py
          ! grep -q 'private-eval' scripts/research/p12_c4_cerebras_synthetic_probe.py
          ! grep -q 'LEGACY_LOCKED_TEST' scripts/research/p12_c4_cerebras_synthetic_probe.py
      - name: Compile runner
        run: python -m py_compile scripts/research/p12_c4_cerebras_synthetic_probe.py
      - name: Validate frozen two-call contract provider-free
        run: |
          python scripts/research/p12_c4_cerebras_synthetic_probe.py --provider-free-contract-check | tee /tmp/p12-c4-cerebras-probe-runner-self-check.json
          python - <<'PY'
          import json
          x=json.load(open('/tmp/p12-c4-cerebras-probe-runner-self-check.json',encoding='utf-8'))
          assert x['status']=='PASS_PROVIDER_FREE_LIVE_STILL_BLOCKED'
          assert x['provider_calls']==0 and x['credentials_read']==0
          assert x['benchmark_inputs_loaded']==0
          assert x['private_oracle_accesses']==0 and x['fresh_blind_accesses']==0 and x['legacy_locked_test_accesses']==0
          assert x['exact_frozen_probe_calls']==2
          assert x['sdk_contract']['sdk_version']=='1.91.0'
          assert x['sdk_contract']['client_warm_tcp_connection'] is False
          assert x['sdk_contract']['client_max_retries']==0
          assert x['attestation_schema_version']=='p12-c4-cerebras-account-capacity-attestation-v2'
          assert x['minimum_seconds_between_any_provider_requests']==75
          assert x['account_attestation_present'] is False
          assert x['live_authorization_present'] is False
          assert x['live_probe_authorized'] is False
          print('P12_C4_CEREBRAS_SYNTHETIC_PROBE_RUNNER_PROVIDER_FREE_V2_PASS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: p12-c4-cerebras-synthetic-probe-runner-self-check
          path: /tmp/p12-c4-cerebras-probe-runner-self-check.json
          retention-days: 90
          if-no-files-found: error
