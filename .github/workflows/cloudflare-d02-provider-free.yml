name: cloudflare-d02-provider-free

on:
  pull_request:
    paths:
      - "src/academy_tractian/cloudflare_provider_d02.py"
      - "tests/test_cloudflare_provider_d02.py"
      - "research/experiments/cloudflare-d02-completion-budget-protocol-v1.json"
      - "docs/adr/026-cloudflare-d02-completion-budget-amendment-2026-09-02.md"
      - ".github/workflows/cloudflare-d02-provider-free.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile D02 module
        run: python -m py_compile src/academy_tractian/cloudflare_provider_d02.py
      - name: D02 provider-free regression
        run: pytest -q tests/test_cloudflare_provider_d02.py
      - name: Prove D01 frozen artifacts remain unchanged
        shell: bash
        run: |
          test "$(git rev-parse HEAD:research/experiments/provider-model-comparison-design-manifest-v2.json)" = "f70837fca46fa8ecf1e63b33ea41dec73fc051e3"
          test "$(git rev-parse HEAD:research/experiments/provider-model-comparison-dev-population-v1.json)" = "abd6a7d973a8779f425c3607d963e29f15db09e5"
          test "$(git rev-parse HEAD:docs/adr/018-cloudflare-provider-model-comparison-preregistration-2026-08-31.md)" = "e075ab4ff21904b9412769496dd2680c049cdaa8"
          test "$(git rev-parse HEAD:docs/adr/019-cloudflare-provider-client-provider-free-implementation-2026-08-31.md)" = "b8f76831aceb13f5f3ffb5d7da0e12b595d9dd1a"
          test "$(git rev-parse HEAD:src/academy_tractian/cloudflare_provider_client.py)" = "a5c814b519584b6d4346e3b0567bbc3da8ba0bf4"
