name: railway-iac-contract

on:
  pull_request:
    paths:
      - ".railway/**"
      - "scripts/validate_railway_iac_contract.py"
      - ".github/workflows/railway-iac-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/validate_railway_iac_contract.py

  typescript-dsl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.20.0"
      - run: npm install --no-save --package-lock=false --ignore-scripts --no-audit --no-fund railway@3.11.0 typescript@5.9.2
      - run: npx tsc --noEmit --target ES2022 --module NodeNext --moduleResolution NodeNext --skipLibCheck .railway/railway.ts
