name: research-e9-v4

on:
  pull_request:
  workflow_dispatch:

jobs:
  evaluator-v4-structural-validity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public-registry dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Compile evaluator v4/v4.1/v4.2 and diagnostics
        run: |
          python -m py_compile scripts/research/e9_evaluator_side_scorer_v4.py
          python -m py_compile scripts/research/e9_evaluator_side_scorer_v4_1.py
          python -m py_compile scripts/research/e9_v4_1_synthetic_selfcheck.py
          python -m py_compile scripts/research/e9_v4_1_groundedness_surface_diagnostic.py
          python -m py_compile scripts/research/e9_v4_1_groundedness_surface_selfcheck.py
          python -m py_compile scripts/research/e9_v4_2_semantic_claim_packet_builder.py
          python -m py_compile scripts/research/e9_v4_2_semantic_claim_packet_builder_selfcheck.py
          python -m py_compile scripts/research/e9_v4_2_semantic_judge_reliability_validator.py
          python -m py_compile scripts/research/e9_v4_2_semantic_judge_reliability_validator_selfcheck.py
          python -m py_compile scripts/research/e9_v4_2_qwen36_27b_synthetic_judge_runner.py
          python -m py_compile scripts/research/e9_v4_2_qwen36_27b_synthetic_judge_runner_selfcheck.py
          python -m py_compile scripts/research/e9_v4_2_qwen36_27b_real_dev_semantic_judge_runner.py
          python -m py_compile scripts/research/e9_v4_2_real_dev_semantic_aggregate.py
          python -m py_compile scripts/research/e9_v4_2_real_dev_semantic_measurement_selfcheck.py
          python -m py_compile scripts/research/e9_v4_2_qwen36_27b_e14o_real_dev_semantic_judge_runner.py
          python -m py_compile scripts/research/e9_v4_2_qwen36_27b_e14o_real_dev_semantic_judge_runner_selfcheck.py
          python -m py_compile scripts/research/e9_v4_2_e14o_real_dev_semantic_aggregate.py
          python -m py_compile scripts/research/e9_v4_2_e14o_real_dev_semantic_aggregate_selfcheck.py
          python -m py_compile scripts/research/e9_private_oracle_group_ambiguity_diagnostic.py
          python -m py_compile scripts/research/e9_private_oracle_visible_case_alignment_diagnostic.py
          python -m py_compile scripts/research/e9_visible_case_alignment_synthetic_selfcheck.py
          python -m py_compile scripts/research/e14m_r1_sanitized_operational_diagnostic.py
          python -m py_compile scripts/research/e14m_r1_sanitized_operational_diagnostic_selfcheck.py
          python -m py_compile scripts/research/e14l_historical_capture_locator.py
          python -m py_compile scripts/research/e14n_public_identifier_provenance_guard.py
          python -m py_compile scripts/research/e14n_public_identifier_provenance_guard_selfcheck.py
          python -m py_compile scripts/research/e14n_public_identifier_provenance_guard_v1_1.py
          python -m py_compile scripts/research/e14n_public_identifier_provenance_guard_v1_1_selfcheck.py
          python -m py_compile scripts/research/e14o_dev_only_public_factual_grounding_prompt.py
          python -m py_compile scripts/research/e14o_dev_only_public_factual_grounding_prompt_selfcheck.py
      - name: Run oracle-free evaluator v4 synthetic validity checks
        run: PYTHONPATH=. python scripts/research/e9_v4_synthetic_selfcheck.py
      - name: Run oracle-free evaluator v4.1 structural regression checks
        run: PYTHONPATH=. python scripts/research/e9_v4_1_synthetic_selfcheck.py
      - name: Run public groundedness surface synthetic checks
        run: PYTHONPATH=. python scripts/research/e9_v4_1_groundedness_surface_selfcheck.py
      - name: Run E14n v1 public identifier provenance guard synthetic checks
        run: PYTHONPATH=. python scripts/research/e14n_public_identifier_provenance_guard_selfcheck.py
      - name: Run E14n v1.1 placeholder-preservation regression checks
        run: PYTHONPATH=. python scripts/research/e14n_public_identifier_provenance_guard_v1_1_selfcheck.py
      - name: Run E14o public factual-grounding structural checks
        run: PYTHONPATH=. python scripts/research/e14o_dev_only_public_factual_grounding_prompt_selfcheck.py
      - name: Run E9 v4.2 semantic claim packet builder synthetic checks
        run: PYTHONPATH=. python scripts/research/e9_v4_2_semantic_claim_packet_builder_selfcheck.py
      - name: Run E9 v4.2 semantic judge reliability validator synthetic checks
        run: PYTHONPATH=. python scripts/research/e9_v4_2_semantic_judge_reliability_validator_selfcheck.py
      - name: Run E9 v4.2 frozen Qwen synthetic judge runner structural checks
        run: PYTHONPATH=. python scripts/research/e9_v4_2_qwen36_27b_synthetic_judge_runner_selfcheck.py
      - name: Run E9 v4.2 historical real DEV semantic measurement structural checks
        run: PYTHONPATH=. python scripts/research/e9_v4_2_real_dev_semantic_measurement_selfcheck.py
      - name: Run E9 v4.2 E14o 66-claim real DEV judge structural checks
        run: PYTHONPATH=. python scripts/research/e9_v4_2_qwen36_27b_e14o_real_dev_semantic_judge_runner_selfcheck.py
      - name: Run E9 v4.2 E14o semantic aggregate pass-fail checks
        run: PYTHONPATH=. python scripts/research/e9_v4_2_e14o_real_dev_semantic_aggregate_selfcheck.py
      - name: Run visible-case oracle alignment synthetic self-check
        run: PYTHONPATH=. python scripts/research/e9_visible_case_alignment_synthetic_selfcheck.py
      - name: Run E14m-R1 sanitized diagnostic metadata self-check
        run: PYTHONPATH=. python scripts/research/e14m_r1_sanitized_operational_diagnostic_selfcheck.py
