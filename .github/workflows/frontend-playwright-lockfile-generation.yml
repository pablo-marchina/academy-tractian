name: frontend-playwright-lockfile-generation

on:
  push:
    branches:
      - feat/p0-playwright-full-product-e2e
    paths:
      - "frontend/package.json"
      - "frontend/playwright.config.ts"
      - ".github/workflows/frontend-playwright-lockfile-generation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate updated lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact prereviewed lockfile digest
        run: echo "9a4eb3b52e357e3fa75d188e739df14c1f6427afff730b82c872b9eaa971bf86  frontend/package-lock.json" | sha256sum --check --strict
      - name: Validate locked dependency graph
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npx playwright install chromium
          npx playwright --version
      - name: Upload lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-package-lock-${{ github.run_id }}
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated lockfile to source branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Validated Playwright lockfile already committed"
            exit 0
          fi
          git commit -m "build: freeze Playwright dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
