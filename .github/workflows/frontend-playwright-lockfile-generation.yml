name: frontend-playwright-lockfile-generation

on:
  push:
    branches:
      - feat/p0-playwright-full-product-e2e
    paths:
      - "frontend/package.json"
      - "frontend/playwright.config.ts"
      - ".github/workflows/frontend-playwright-lockfile-generation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate updated lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Validate locked dependency graph
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npx playwright install chromium
          npx playwright --version
      - name: Upload lockfile candidate
        uses: actions/upload-artifact@v4
        with:
          name: frontend-playwright-package-lock-${{ github.run_id }}
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
