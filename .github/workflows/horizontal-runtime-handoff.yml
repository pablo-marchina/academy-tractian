name: horizontal-runtime-handoff

on:
  workflow_call:
  pull_request:
    paths:
      - "src/academy_tractian/product_api.py"
      - "src/academy_tractian/action_product_api.py"
      - "src/academy_tractian/product_storage_contracts.py"
      - "src/academy_tractian/postgres_runtime_handoff.py"
      - "src/academy_tractian/runtime_handoff_supervisor.py"
      - "src/academy_tractian/production_actions_v2.py"
      - "src/academy_tractian/postgres_product_api.py"
      - "tests/test_postgres_runtime_handoff.py"
      - "tests/test_postgres_multi_instance_product.py"
      - "tests/test_postgres_restart_recovery_campaign.py"
      - "research/runtime-handoff-decision-2026-09-05.md"
      - ".github/workflows/horizontal-runtime-handoff.yml"
      - ".github/workflows/final-ci-required.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-horizontal-runtime:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_tractian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_tractian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_OPERATIONAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/academy_tractian
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Prove lease, fencing and cross-replica recovery
        run: >-
          python -m pytest -q
          tests/test_postgres_runtime_handoff.py
          tests/test_postgres_multi_instance_product.py

      - name: Regress restart safety boundary
        run: python -m pytest -q tests/test_postgres_restart_recovery_campaign.py

      - name: Verify production handoff imports
        run: |
          python - <<'PY'
          from academy_tractian.postgres_runtime_handoff import PostgresRuntimeHandoffStore
          from academy_tractian.product_storage_contracts import (
              RuntimeExecutionEnvelope,
              RuntimeHandoffClaim,
              RuntimeHandoffStore,
          )
          from academy_tractian.runtime_handoff_supervisor import (
              ClaimBoundObservabilityEventSink,
              HorizontalRuntimeSupervisor,
          )
          assert PostgresRuntimeHandoffStore is not None
          assert RuntimeExecutionEnvelope is not None
          assert RuntimeHandoffClaim is not None
          assert RuntimeHandoffStore is not None
          assert ClaimBoundObservabilityEventSink is not None
          assert HorizontalRuntimeSupervisor is not None
          print("HORIZONTAL_RUNTIME_HANDOFF_IMPORT=PASS")
          PY
