name: cloudflare-live-authorization-v1-provider-free

on:
  pull_request:
    paths:
      - research/experiments/cloudflare-live-authorization-protocol-v1.json
      - research/results/cloudflare-live-authorization-v1-provider-free-validation-2026-09-01.json
      - src/academy_tractian/cloudflare_live_authorization_v1.py
      - scripts/research/validate_cloudflare_live_authorization_protocol_v1.py
      - scripts/research/issue_cloudflare_live_authorization_receipt_v1.py
      - tests/test_cloudflare_live_authorization_v1.py
      - src/academy_tractian/cloudflare_provider_live_v2.py
      - src/academy_tractian/cloudflare_provider_comparison_v2.py
      - src/academy_tractian/cloudflare_provider_client.py
      - docs/adr/018-cloudflare-provider-model-comparison-preregistration-2026-08-31.md
      - docs/adr/019-cloudflare-provider-client-provider-free-implementation-2026-08-31.md
      - docs/adr/020-cloudflare-executor-custody-v2-provider-free-implementation-2026-09-01.md
      - docs/adr/021-cloudflare-live-execution-authorization-protocol-2026-09-01.md
      - docs/CURRENT-PROJECT-STATUS.md
      - docs/NEXT-STEPS.md
      - docs/progress/041-cloudflare-live-authorization-protocol-2026-09-01.md
      - .github/workflows/cloudflare-live-authorization-v1-provider-free.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-provider-free-live-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ensure provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
      - name: Validate frozen authorization protocol candidate
        run: python scripts/research/validate_cloudflare_live_authorization_protocol_v1.py
      - name: Run provider-free authorization tests
        run: python -m pytest -q tests/test_cloudflare_live_authorization_v1.py
      - name: Preserve Cloudflare v2 executor/client/provenance regressions
        run: python -m pytest -q tests/test_cloudflare_provider_comparison_v2.py tests/test_cloudflare_provider_provenance_v2.py tests/test_cloudflare_provider_client.py
      - name: Preserve historical executor/custody regressions
        run: python -m pytest -q tests/test_provider_comparison.py tests/test_provider_live_execution.py tests/test_provider_live_task.py
