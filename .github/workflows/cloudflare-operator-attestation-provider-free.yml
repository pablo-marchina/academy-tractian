name: cloudflare-operator-attestation-provider-free

on:
  pull_request:
    paths:
      - "docs/adr/025-cloudflare-operator-attestation-source-amendment-2026-09-02.md"
      - "research/experiments/cloudflare-live-authorization-operator-attestation-amendment-v1.json"
      - "src/academy_tractian/cloudflare_live_authorization_operator_attestation_v4.py"
      - "src/academy_tractian/cloudflare_frozen_bundle_portability.py"
      - "scripts/research/capture_cloudflare_operator_attestation_evidence_v1.py"
      - "scripts/research/issue_cloudflare_operator_attestation_receipt_v1.py"
      - "scripts/research/execute_cloudflare_live_comparison_operator_attestation_v1.py"
      - "tests/test_cloudflare_operator_attestation_authorization_v4.py"
      - "tests/test_cloudflare_frozen_bundle_portability.py"
      - ".github/workflows/cloudflare-operator-attestation-provider-free.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile new CLIs
        run: |
          python -m py_compile scripts/research/capture_cloudflare_operator_attestation_evidence_v1.py
          python -m py_compile scripts/research/issue_cloudflare_operator_attestation_receipt_v1.py
          python -m py_compile scripts/research/execute_cloudflare_live_comparison_operator_attestation_v1.py
      - name: Provider-free regression
        run: |
          pytest -q \
            tests/test_cloudflare_operator_attestation_authorization_v4.py \
            tests/test_cloudflare_frozen_bundle_portability.py \
            tests/test_cloudflare_live_authorization_reset_v2.py \
            tests/test_cloudflare_governed_live_entrypoint.py
