name: provider-model-comparison-design-v2

on:
  pull_request:
    paths:
      - research/provider-model-comparison-design-v2-2026-08-31.md
      - research/experiments/provider-model-comparison-design-manifest-v2.json
      - research/experiments/provider-model-comparison-dev-population-v1.json
      - scripts/research/validate_provider_model_comparison_design_v2.py
      - tests/test_provider_model_comparison_design_v2.py
      - .github/workflows/provider-model-comparison-design-v2.yml
      - docs/adr/018-cloudflare-provider-model-comparison-preregistration-2026-08-31.md
      - docs/adr/README.md
      - docs/CURRENT-PROJECT-STATUS.md
      - docs/NEXT-STEPS.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-provider-free-design-v2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Validate preregistered Cloudflare comparison
        run: python scripts/research/validate_provider_model_comparison_design_v2.py
      - name: Run v2 preregistration regression tests
        run: python -m pytest -q tests/test_provider_model_comparison_design_v2.py
