name: governed-action-resource-preflight

on:
  push:
    branches:
      - feat/governed-execute-v1
    paths:
      - ".github/workflows/governed-action-resource-preflight.yml"
  workflow_dispatch:

jobs:
  inspect-supplied-runtime-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct immutable supplied runtime
        run: |
          mkdir -p /tmp/tractian-runtime
          cat services/tractian-supplied-api/runtime.bundle.b64.part* | base64 -d > /tmp/tractian-runtime.tar.gz
          echo "0db58e29d6f5c86ef1838acf31c4caed788b393eb1807345fabd157c8de5bb9a  /tmp/tractian-runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tractian-runtime.tar.gz -C /tmp/tractian-runtime

      - name: Print only safe resource identifiers for governed-action grants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('/tmp/tractian-runtime')
          patterns = {
              'company': re.compile(r'\bcomp_[A-Za-z0-9_-]+\b'),
              'asset': re.compile(r'\basset_[A-Za-z0-9_-]+\b'),
              'analysis': re.compile(r'\banalysis_[A-Za-z0-9_-]+\b'),
              'model': re.compile(r'\bmodel_[A-Za-z0-9_-]+\b'),
              'case': re.compile(r'\bcase_[A-Za-z0-9_-]+\b'),
          }
          found = {key: set() for key in patterns}
          allowed_suffixes = {'.py', '.json', '.jsonl', '.csv', '.md', '.txt', '.yaml', '.yml'}
          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in allowed_suffixes:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              for key, pattern in patterns.items():
                  found[key].update(pattern.findall(text))
          for key in ('company', 'asset', 'analysis', 'model', 'case'):
              print(f'RESOURCE_IDS[{key}]=' + ','.join(sorted(found[key])))
          PY

      - name: Map action-resource identifiers to Papel Sul without exposing payloads
        run: |
          python - <<'PY'
          from pathlib import Path
          import json, re

          root = Path('/tmp/tractian-runtime')
          target = 'comp_papel_sul'
          id_patterns = {
              'asset': re.compile(r'^asset_[A-Za-z0-9_-]+$'),
              'analysis': re.compile(r'^analysis_[A-Za-z0-9_-]+$'),
              'model': re.compile(r'^model_[A-Za-z0-9_-]+$'),
              'case': re.compile(r'^case_[A-Za-z0-9_-]+$'),
          }
          found = {key: set() for key in id_patterns}
          source_hints = set()

          def walk(value, inherited_company=None):
              if isinstance(value, dict):
                  company = inherited_company
                  for key in ('company_id', 'companyId', 'organization_id', 'organizationId'):
                      if value.get(key) == target:
                          company = target
                  if company == target:
                      for v in value.values():
                          if isinstance(v, str):
                              for kind, pattern in id_patterns.items():
                                  if pattern.fullmatch(v) and v not in {'asset_id','analysis_id','model_id','case_id'}:
                                      found[kind].add(v)
                  for v in value.values():
                      walk(v, company)
              elif isinstance(value, list):
                  for item in value:
                      walk(item, inherited_company)

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              suffix = path.suffix.lower()
              if suffix in {'.json', '.jsonl'}:
                  try:
                      text = path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  try:
                      if suffix == '.json':
                          walk(json.loads(text))
                      else:
                          for line in text.splitlines():
                              try: walk(json.loads(line))
                              except json.JSONDecodeError: pass
                  except json.JSONDecodeError:
                      pass
              if suffix in {'.py', '.json', '.jsonl', '.csv', '.md', '.txt', '.yaml', '.yml'}:
                  try:
                      text = path.read_text(encoding='utf-8')
                  except (UnicodeDecodeError, OSError):
                      continue
                  if target in text and any(marker in text for marker in ('/analyses/', '/models/', '/cases/', 'analysis_id', 'model_id', 'case_id')):
                      source_hints.add(str(path.relative_to(root)))

          for kind in ('asset', 'analysis', 'model', 'case'):
              print(f'PAPEL_SUL_RESOURCE_IDS[{kind}]=' + ','.join(sorted(found[kind])))
          print('PAPEL_SUL_ACTION_SOURCE_FILES=' + ','.join(sorted(source_hints)))

          # Print only source-code lines that define action endpoint behavior or ID generation.
          safe_markers = ('/analyses/', '/models/', '/cases/', 'analysis_id', 'model_id', 'case_id')
          for rel in sorted(source_hints):
              path = root / rel
              try:
                  lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError):
                  continue
              for idx, line in enumerate(lines, start=1):
                  stripped = line.strip()
                  if any(marker in stripped for marker in safe_markers) and len(stripped) <= 300:
                      print(f'SOURCE_HINT[{rel}:{idx}]={stripped}')
          PY
