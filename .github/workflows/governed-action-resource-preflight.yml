name: governed-action-resource-preflight

on:
  push:
    branches:
      - feat/governed-execute-v1
    paths:
      - ".github/workflows/governed-action-resource-preflight.yml"
  workflow_dispatch:

jobs:
  inspect-supplied-runtime-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct immutable supplied runtime
        run: |
          mkdir -p /tmp/tractian-runtime
          cat services/tractian-supplied-api/runtime.bundle.b64.part* | base64 -d > /tmp/tractian-runtime.tar.gz
          echo "0db58e29d6f5c86ef1838acf31c4caed788b393eb1807345fabd157c8de5bb9a  /tmp/tractian-runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tractian-runtime.tar.gz -C /tmp/tractian-runtime

      - name: Resolve only governed-action resource identifiers for Papel Sul
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('/tmp/tractian-runtime')
          target_company = 'comp_papel_sul'
          target_asset = 'asset_V301'
          asset_ids, analysis_ids, model_ids, case_ids = set(), set(), set(), set()

          def scalar_id(record, *keys):
              for key in keys:
                  value = record.get(key)
                  if isinstance(value, str) and value.strip():
                      return value.strip()
              return None

          def visit(value, inherited_company=None, inherited_asset=None):
              if isinstance(value, dict):
                  company = scalar_id(value, 'company_id', 'companyId') or inherited_company
                  asset = scalar_id(value, 'asset_id', 'assetId') or inherited_asset
                  rid = scalar_id(value, 'id', 'analysis_id', 'analysisId', 'model_id', 'modelId', 'case_id', 'caseId')

                  if company == target_company:
                      direct_asset = scalar_id(value, 'asset_id', 'assetId', 'id')
                      if isinstance(direct_asset, str) and direct_asset.startswith('asset_'):
                          asset_ids.add(direct_asset)
                      direct_case = scalar_id(value, 'case_id', 'caseId', 'id')
                      if isinstance(direct_case, str) and direct_case.startswith('case_'):
                          case_ids.add(direct_case)

                  if asset == target_asset or (rid == target_asset and company == target_company):
                      asset_ids.add(target_asset)
                      candidate_analysis = scalar_id(value, 'analysis_id', 'analysisId', 'id')
                      if isinstance(candidate_analysis, str) and candidate_analysis != target_asset:
                          # Analysis fixture ids are not required to use an analysis_ prefix.
                          if any(k in value for k in ('analysis_id','analysisId','status','diagnosis','severity')):
                              analysis_ids.add(candidate_analysis)
                      candidate_model = scalar_id(value, 'model_id', 'modelId')
                      if candidate_model:
                          model_ids.add(candidate_model)

                  # Case fixtures can carry asset/company context rather than a case_ prefix field.
                  if company == target_company and asset == target_asset:
                      candidate_case = scalar_id(value, 'case_id', 'caseId', 'id')
                      if isinstance(candidate_case, str) and candidate_case.startswith('case_'):
                          case_ids.add(candidate_case)

                  for child in value.values():
                      visit(child, company, asset)
              elif isinstance(value, list):
                  for child in value:
                      visit(child, inherited_company, inherited_asset)

          for path in root.rglob('*'):
              if not path.is_file() or path.suffix.lower() not in {'.json', '.jsonl'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              if path.suffix.lower() == '.json':
                  try:
                      visit(json.loads(text))
                  except json.JSONDecodeError:
                      pass
              else:
                  for line in text.splitlines():
                      try:
                          visit(json.loads(line))
                      except json.JSONDecodeError:
                          pass

          # Also follow model ids referenced by any discovered analysis record regardless of nesting.
          # We print identifiers only, never fixture bodies.
          print('PAPEL_SUL_ACTION_ASSET_IDS=' + ','.join(sorted(asset_ids)))
          print('PAPEL_SUL_ACTION_ANALYSIS_IDS=' + ','.join(sorted(analysis_ids)))
          print('PAPEL_SUL_ACTION_MODEL_IDS=' + ','.join(sorted(model_ids)))
          print('PAPEL_SUL_ACTION_CASE_IDS=' + ','.join(sorted(case_ids)))
          if not asset_ids or not analysis_ids or not model_ids or not case_ids:
              raise SystemExit('governed action resource set incomplete')
          PY
