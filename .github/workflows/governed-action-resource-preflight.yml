name: governed-action-resource-preflight

on:
  push:
    branches:
      - feat/governed-execute-v1
    paths:
      - ".github/workflows/governed-action-resource-preflight.yml"
  workflow_dispatch:

jobs:
  inspect-supplied-runtime-resources:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reconstruct immutable supplied runtime
        run: |
          mkdir -p /tmp/tractian-runtime
          cat services/tractian-supplied-api/runtime.bundle.b64.part* | base64 -d > /tmp/tractian-runtime.tar.gz
          echo "0db58e29d6f5c86ef1838acf31c4caed788b393eb1807345fabd157c8de5bb9a  /tmp/tractian-runtime.tar.gz" | sha256sum -c -
          tar -xzf /tmp/tractian-runtime.tar.gz -C /tmp/tractian-runtime

      - name: Extract only identity fields associated with Papel Sul resources
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json, re

          root = Path('/tmp/tractian-runtime')
          target_company = 'comp_papel_sul'
          target_asset = 'asset_V301'
          candidates = {'analysis': set(), 'model': set(), 'case': set()}
          files_with_asset = []

          def add_record(record, source):
              if not isinstance(record, dict):
                  return
              vals = {str(k): v for k, v in record.items()}
              company = vals.get('company_id') or vals.get('companyId')
              asset = vals.get('asset_id') or vals.get('assetId')
              if company != target_company and asset != target_asset and target_asset not in map(str, vals.values()):
                  return
              files_with_asset.append(source)
              rid = vals.get('analysis_id') or vals.get('analysisId')
              generic_id = vals.get('id')
              if rid:
                  candidates['analysis'].add(str(rid))
              elif asset == target_asset and generic_id and any(k in vals for k in ('status','diagnosis','severity','prediction','score')):
                  candidates['analysis'].add(str(generic_id))
              mid = vals.get('model_id') or vals.get('modelId')
              if mid:
                  candidates['model'].add(str(mid))
              cid = vals.get('case_id') or vals.get('caseId')
              if cid:
                  candidates['case'].add(str(cid))
              elif company == target_company and generic_id and str(generic_id).startswith('case_'):
                  candidates['case'].add(str(generic_id))

          def walk(value, source):
              if isinstance(value, dict):
                  add_record(value, source)
                  for child in value.values():
                      walk(child, source)
              elif isinstance(value, list):
                  for child in value:
                      walk(child, source)

          for path in root.rglob('*'):
              if not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              rel = str(path.relative_to(root))
              suffix = path.suffix.lower()
              if suffix == '.json':
                  try: walk(json.loads(text), rel)
                  except json.JSONDecodeError: pass
              elif suffix == '.jsonl':
                  for line in text.splitlines():
                      try: walk(json.loads(line), rel)
                      except json.JSONDecodeError: pass
              elif suffix == '.csv':
                  try:
                      for row in csv.DictReader(io.StringIO(text)):
                          add_record(row, rel)
                  except csv.Error:
                      pass
              if target_asset in text:
                  files_with_asset.append(rel)
                  # Parse key/value identity tokens even from Python/YAML/Markdown fixtures.
                  for key, value in re.findall(r'["\']?(analysis_id|analysisId|model_id|modelId|case_id|caseId|id)["\']?\s*[:=]\s*["\']([A-Za-z0-9_.:-]+)["\']', text):
                      window = text[max(0, text.find(value)-1200):text.find(value)+1200]
                      if target_asset not in window and target_company not in window:
                          continue
                      if key in ('analysis_id','analysisId'):
                          candidates['analysis'].add(value)
                      elif key in ('model_id','modelId'):
                          candidates['model'].add(value)
                      elif key in ('case_id','caseId') or value.startswith('case_'):
                          candidates['case'].add(value)

          print('PAPEL_SUL_ACTION_ANALYSIS_IDS=' + ','.join(sorted(candidates['analysis'])))
          print('PAPEL_SUL_ACTION_MODEL_IDS=' + ','.join(sorted(candidates['model'])))
          print('PAPEL_SUL_ACTION_CASE_IDS=' + ','.join(sorted(candidates['case'])))
          print('PAPEL_SUL_ASSET_SOURCE_FILES=' + ','.join(sorted(set(files_with_asset))))

          # Print store implementation structure only, so we can determine canonical backing files.
          for path in root.rglob('*.py'):
              try: lines = path.read_text(encoding='utf-8').splitlines()
              except (UnicodeDecodeError, OSError): continue
              for i, line in enumerate(lines, 1):
                  low = line.lower()
                  if any(name in low for name in ('def get_analysis','def list_analyses','def get_model','analyses =','models =','analyses_path','models_path')):
                      s = line.strip()
                      if len(s) <= 300:
                          print(f'STORE_HINT[{path.relative_to(root)}:{i}]={s}')
          PY
