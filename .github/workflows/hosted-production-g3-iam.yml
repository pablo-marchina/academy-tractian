name: hosted-production-g3-iam

on:
  workflow_dispatch:
  push:
    branches: [release/production-final]
    paths:
      - ".github/workflows/hosted-production-g3-iam.yml"
      - "scripts/production_hosted_g3_iam_smoke.py"
      - "scripts/production_hosted_g3_redirect_probe.py"
      - "src/academy_tractian/neon_auth_identity.py"
      - "src/academy_tractian/neon_authenticated_postgres_product_api.py"
      - "frontend/src/auth/**"
      - "frontend/Caddyfile.production"

permissions:
  contents: read

concurrency:
  group: hosted-production-g3-iam
  cancel-in-progress: false

jobs:
  hosted-iam-acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      ACADEMY_PRODUCTION_WEB_BASE_URL: https://production-web-production-c9d1.up.railway.app
      ACADEMY_G3_CROSS_TENANT_RUN_ID: g2-durability-234655d9
    steps:
      - uses: actions/checkout@v4
      - name: Diagnose hosted auth redirect boundary without exposing credentials
        run: python scripts/production_hosted_g3_redirect_probe.py
      - name: Run hosted two-user IAM and tenant-boundary campaign
        run: python scripts/production_hosted_g3_iam_smoke.py
