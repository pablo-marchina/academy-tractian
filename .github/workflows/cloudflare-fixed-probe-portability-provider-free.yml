name: cloudflare-fixed-probe-portability-provider-free

on:
  pull_request:
    paths:
      - "scripts/research/execute_cloudflare_live_comparison_operator_attestation_v1.py"
      - "tests/test_cloudflare_fixed_probe_frozen_root_portability.py"
      - ".github/workflows/cloudflare-fixed-probe-portability-provider-free.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Regression
        run: pytest -q tests/test_cloudflare_fixed_probe_frozen_root_portability.py
