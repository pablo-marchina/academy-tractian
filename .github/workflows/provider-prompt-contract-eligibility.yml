name: Provider prompt contract eligibility

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/provider-eligibility-dp007-20260908
    paths:
      - scripts/verification/provider_prompt_contract_probe.py
      - .github/workflows/provider-prompt-contract-eligibility.yml

permissions:
  contents: write

jobs:
  provider-prompt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/provider-eligibility-dp007-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -q .
      - name: Verify provider credentials are available
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          test -n "$OPENROUTER_API_KEY"
      - name: Run sanitized synthetic probes
        id: probes
        shell: bash
        run: |
          mkdir -p research/evidence/live/provider-prompt-contract
          set +e
          PROVIDER_PROMPT_PROBE_PROVIDER=nvidia python -u scripts/verification/provider_prompt_contract_probe.py > research/evidence/live/provider-prompt-contract/nvidia.txt 2>&1
          NVIDIA_RC=$?
          PROVIDER_PROMPT_PROBE_PROVIDER=openrouter python -u scripts/verification/provider_prompt_contract_probe.py > research/evidence/live/provider-prompt-contract/openrouter.txt 2>&1
          OPENROUTER_RC=$?
          set -e
          echo "nvidia_rc=$NVIDIA_RC" >> "$GITHUB_OUTPUT"
          echo "openrouter_rc=$OPENROUTER_RC" >> "$GITHUB_OUTPUT"
      - name: Persist sanitized evidence
        shell: bash
        run: |
          git config user.name "academy-tractian-ci"
          git config user.email "academy-tractian-ci@users.noreply.github.com"
          git add research/evidence/live/provider-prompt-contract/nvidia.txt research/evidence/live/provider-prompt-contract/openrouter.txt
          git commit -m "evidence(provider): persist prompt contract probes" || true
          git push origin HEAD:experiment/provider-eligibility-dp007-20260908
      - name: Enforce prompt contract gate
        shell: bash
        run: |
          test "${{ steps.probes.outputs.nvidia_rc }}" = "0"
          test "${{ steps.probes.outputs.openrouter_rc }}" = "0"
