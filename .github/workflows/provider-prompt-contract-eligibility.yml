name: Provider prompt contract eligibility

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/provider-eligibility-dp007-20260908
    paths:
      - src/academy_tractian/nvidia_provider_client.py
      - scripts/verification/provider_prompt_contract_probe.py
      - scripts/verification/diagnose_nvidia_catalog.py
      - scripts/verification/diagnose_openrouter_key_capacity.py
      - tests/test_nvidia_provider_client.py
      - tests/test_provider_prompt_contract_probe.py
      - .github/workflows/provider-prompt-contract-eligibility.yml

permissions:
  contents: write

jobs:
  provider-prompt-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: experiment/provider-eligibility-dp007-20260908
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and focused test dependency
        run: |
          python -m pip install -q .
          python -m pip install -q pytest
      - name: Run provider contract regression tests
        run: |
          python -m pytest -q \
            tests/test_provider_prompt_contract_probe.py \
            tests/test_nvidia_provider_client.py
      - name: Verify provider credentials are available
        shell: bash
        run: |
          test -n "$NVIDIA_API_KEY"
          test -n "$OPENROUTER_API_KEY"
      - name: Run sanitized discovery and eligible synthetic probes
        id: probes
        shell: bash
        run: |
          mkdir -p research/evidence/live/provider-prompt-contract
          set +e

          python -u scripts/verification/diagnose_nvidia_catalog.py > research/evidence/live/provider-prompt-contract/nvidia-catalog.txt 2>&1
          NVIDIA_CATALOG_RC=$?

          ACADEMY_PROVIDER_API_TOKEN="$OPENROUTER_API_KEY" \
          OPENROUTER_DIAGNOSTIC_TOKEN_ENV=ACADEMY_PROVIDER_API_TOKEN \
          python -u scripts/verification/diagnose_openrouter_key_capacity.py > research/evidence/live/provider-prompt-contract/openrouter-capacity.txt 2>&1
          OPENROUTER_CAPACITY_RC=$?

          if [ "$NVIDIA_CATALOG_RC" = "0" ]; then
            PROVIDER_PROMPT_PROBE_PROVIDER=nvidia \
            python -u scripts/verification/provider_prompt_contract_probe.py > research/evidence/live/provider-prompt-contract/nvidia.txt 2>&1
            NVIDIA_RC=$?
          else
            NVIDIA_RC=2
            printf '%s\n' '{"schema_version":"provider-prompt-contract-skip-v1","provider_id":"nvidia","result":"SKIP","reason":"CATALOG_INELIGIBLE","benchmark_inputs_loaded":0,"credentials_recorded":false,"raw_provider_material_recorded":false}' > research/evidence/live/provider-prompt-contract/nvidia.txt
          fi

          if [ "$OPENROUTER_CAPACITY_RC" = "0" ]; then
            PROVIDER_PROMPT_PROBE_PROVIDER=openrouter \
            python -u scripts/verification/provider_prompt_contract_probe.py > research/evidence/live/provider-prompt-contract/openrouter.txt 2>&1
            OPENROUTER_RC=$?
          else
            OPENROUTER_RC=2
            printf '%s\n' '{"schema_version":"provider-prompt-contract-skip-v1","provider_id":"openrouter","result":"SKIP","reason":"CAPACITY_INELIGIBLE","benchmark_inputs_loaded":0,"credentials_recorded":false,"raw_provider_material_recorded":false}' > research/evidence/live/provider-prompt-contract/openrouter.txt
          fi

          set -e
          echo "nvidia_catalog_rc=$NVIDIA_CATALOG_RC" >> "$GITHUB_OUTPUT"
          echo "openrouter_capacity_rc=$OPENROUTER_CAPACITY_RC" >> "$GITHUB_OUTPUT"
          echo "nvidia_rc=$NVIDIA_RC" >> "$GITHUB_OUTPUT"
          echo "openrouter_rc=$OPENROUTER_RC" >> "$GITHUB_OUTPUT"
      - name: Persist sanitized evidence
        shell: bash
        run: |
          git config user.name "academy-tractian-ci"
          git config user.email "academy-tractian-ci@users.noreply.github.com"
          git add \
            research/evidence/live/provider-prompt-contract/nvidia-catalog.txt \
            research/evidence/live/provider-prompt-contract/openrouter-capacity.txt \
            research/evidence/live/provider-prompt-contract/nvidia.txt \
            research/evidence/live/provider-prompt-contract/openrouter.txt
          git commit -m "evidence(provider): persist eligibility discovery" || true
          git push origin HEAD:experiment/provider-eligibility-dp007-20260908
      - name: Enforce eligibility gates
        shell: bash
        run: |
          test "${{ steps.probes.outputs.nvidia_catalog_rc }}" = "0"
          test "${{ steps.probes.outputs.openrouter_capacity_rc }}" = "0"
          test "${{ steps.probes.outputs.nvidia_rc }}" = "0"
          test "${{ steps.probes.outputs.openrouter_rc }}" = "0"
