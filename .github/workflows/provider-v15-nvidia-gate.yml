name: provider-v15-nvidia-gate

on:
  pull_request:
    paths:
      - "src/academy_tractian/release_provider_v15.py"
      - "src/academy_tractian/remote_server.py"
      - "tests/test_release_provider_v15_nvidia.py"
      - "tests/test_release_provider_v14_length.py"
      - "scripts/research/p12_c4_nvidia_synthetic_probe.py"
      - ".github/workflows/provider-v15-nvidia-gate.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-and-v14-freeze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Run V15 boundary tests and frozen V14 regression
        run: >-
          python -m pytest -q
          tests/test_release_provider_v15_nvidia.py
          tests/test_release_provider_v14_length.py
          tests/test_remote_server.py

  synthetic-live-compatibility:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      NVIDIA_MODEL_ID: openai/gpt-oss-120b
      NVIDIA_LIVE_PROBE_AUTHORIZED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run two-call sanitized NVIDIA compatibility probe
        run: python scripts/research/p12_c4_nvidia_synthetic_probe.py
