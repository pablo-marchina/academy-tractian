name: restart-recovery-campaign

on:
  pull_request:
    paths:
      - "src/academy_tractian/restart_recovery_campaign.py"
      - "src/academy_tractian/postgres_*.py"
      - "src/academy_tractian/action_recovery.py"
      - "src/academy_tractian/action_product_api.py"
      - "src/academy_tractian/authenticated_postgres_product_api.py"
      - "src/academy_tractian/product_api.py"
      - "tests/test_restart_recovery_campaign.py"
      - "tests/test_postgres_restart_recovery_campaign.py"
      - "research/restart-recovery-protocol-v1.json"
      - ".github/workflows/restart-recovery-campaign.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  restart-recovery-contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_tractian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_tractian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_OPERATIONAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/academy_tractian
      RESTART_RECOVERY_OUTPUT: restart-recovery-ci-report.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Run aggregate recovery contract tests
        run: python -m pytest -q tests/test_restart_recovery_campaign.py
      - name: Run authenticated PostgreSQL restart campaign
        run: python -m pytest -q tests/test_postgres_restart_recovery_campaign.py
      - name: Verify installed recovery imports
        run: |
          python - <<'PY'
          from academy_tractian.restart_recovery_campaign import (
              RestartRecoveryProtocol,
              build_restart_recovery_report,
          )
          assert RestartRecoveryProtocol is not None
          assert callable(build_restart_recovery_report)
          print("restart recovery campaign imports passed")
          PY
      - name: Publish aggregate recovery evidence
        uses: actions/upload-artifact@v4
        with:
          name: restart-recovery-ci-report
          path: restart-recovery-ci-report.json
          if-no-files-found: error
          retention-days: 30
