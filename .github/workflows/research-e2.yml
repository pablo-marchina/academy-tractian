name: research-e2-e3-e4-e5-e6-e7-e8-free-anywhere-pilot

on:
  push:
    branches: [research/systematic-foundation]
    paths:
      - 'README.md'
      - 'docs/PROJECT-PLAN.md'
      - 'research/README.md'
      - 'research/37-post-freeze-execution-backlog.md'
      - 'research/e2/**'
      - 'research/e4/**'
      - 'research/40-e3-benchmark-split-freeze-v1.md'
      - 'research/41-e4-guarded-boundary-experiment-preregistration.md'
      - 'research/42-e4-execution-start-report.md'
      - 'research/47-e5-evidence-stopping-preregistration.md'
      - 'research/49-e6-runtime-spike-preregistration.md'
      - 'research/51-e6-langgraph-integration-spike-preregistration.md'
      - 'research/53-e6-real-toolspec-langgraph-preregistration.md'
      - 'research/57-e7-native-tools-vs-mcp-preregistration.md'
      - 'research/58-e7-native-tools-vs-mcp-results.md'
      - 'research/59-e7-topology-adr.md'
      - 'research/60-e8-statistical-pilot-model-benchmark-preregistration.md'
      - 'research/61-e8-free-pilot-execution-results.md'
      - 'research/62-e8-free-anywhere-candidate-discovery.md'
      - 'research/63-e8-free-anywhere-real-candidate-run-instructions.md'
      - 'research/64-e8-free-provider-connectivity-review.md'
      - 'research/65-e8-groq-free-anywhere-model-run-results.md'
      - 'research/66-e8-optional-free-provider-comparators.md'
      - 'research/67-e9-evaluator-side-task-quality-scorer-preregistration.md'
      - 'research/frozen/benchmark-split-v1.json'
      - 'research/experiments/e4-*.json'
      - 'research/experiments/e5-*.json'
      - 'research/experiments/e6-*.json'
      - 'research/experiments/e7-*.json'
      - 'research/experiments/e8-*.json'
      - 'research/results/e7-*.json'
      - 'research/results/e8-*.json'
      - 'scripts/research/e2_*.py'
      - 'scripts/research/e3_validate_split.py'
      - 'scripts/research/e4_*.py'
      - 'scripts/research/e5_*.py'
      - 'scripts/research/e6_*.py'
      - 'scripts/research/e7_*.py'
      - 'scripts/research/e8_*.py'
      - '.github/workflows/research-e2.yml'
  workflow_dispatch:

jobs:
  e2-e3-e4-e5-e6-e7-e8-free-anywhere-pilot-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install test dependencies
        run: python -m pip install 'pydantic>=2.6,<3' 'pytest>=8' 'langgraph>=1.0,<2'
      - name: Run E2 suite
        run: python -m pytest research/e2/tests -q
      - name: Run E4 DEV runner tests
        run: python -m pytest research/e4/tests -q
      - name: Validate E3 benchmark split
        run: python scripts/research/e3_validate_split.py --split research/frozen/benchmark-split-v1.json
      - name: Validate E4 experiment manifest
        run: python scripts/research/e4_validate_experiment_manifest.py --manifest research/experiments/e4-b0-b3-experiment-manifest.json --split research/frozen/benchmark-split-v1.json
      - name: Execute E4 DEV runner smoke run
        run: PYTHONPATH=. python scripts/research/e4_dev_runner.py --split-manifest research/frozen/benchmark-split-v1.json --split DEV --proposal-source-class scripted_reference --out /tmp/e4-dev-runner-smoke.json
      - name: Execute E4 DEV model-proposal adapter
        run: PYTHONPATH=. python scripts/research/e4_model_proposal_adapter.py --split-manifest research/frozen/benchmark-split-v1.json --proposal-plan research/experiments/e4-dev-model-proposal-plan-gpt-5-5-thinking-2026-08-16.json --split DEV --out /tmp/e4-dev-model-proposal-boundary.json
      - name: Execute E4 DEV scoreable proposal adapter
        run: PYTHONPATH=. python scripts/research/e4_model_proposal_adapter.py --split-manifest research/frozen/benchmark-split-v1.json --proposal-plan research/experiments/e4-dev-scoreable-proposal-plan-gpt-5-5-thinking-2026-08-16.json --split DEV --out /tmp/e4-dev-scoreable-proposal-boundary.json
      - name: Execute E4 VALIDATION proposal adapter
        run: PYTHONPATH=. python scripts/research/e4_validation_proposal_adapter.py --split-manifest research/frozen/benchmark-split-v1.json --proposal-plan research/experiments/e4-validation-scoreable-proposal-plan-gpt-5-5-thinking-2026-08-16.json --split VALIDATION --out /tmp/e4-validation-scoreable-proposal-boundary.json
      - name: Execute E5 evidence stopping runner
        run: PYTHONPATH=. python scripts/research/e5_evidence_stopping_runner.py --manifest research/experiments/e5-evidence-stopping-experiment-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e5-evidence-stopping-summary.json
      - name: Execute E6 runtime spike runner
        run: PYTHONPATH=. python scripts/research/e6_runtime_spike_runner.py --manifest research/experiments/e6-runtime-spike-manifest.json --out /tmp/e6-runtime-spike-summary.json
      - name: Execute E6 LangGraph integration spike
        run: PYTHONPATH=. python scripts/research/e6_langgraph_integration_spike.py --manifest research/experiments/e6-langgraph-integration-spike-manifest.json --out /tmp/e6-langgraph-integration-summary.json
      - name: Execute E6 adaptive ToolSpec LangGraph runner
        run: PYTHONPATH=. python scripts/research/e6_langgraph_toolspec_runner_v3.py --manifest research/experiments/e6-real-toolspec-langgraph-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e6-real-toolspec-langgraph-summary.json
      - name: Execute E6 live API integration contract
        run: PYTHONPATH=. python scripts/research/e6_live_api_langgraph_runner.py --transport-mode contract --manifest research/experiments/e6-live-api-integration-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e6-live-api-integration-summary.json
      - name: Execute E7 native tools vs MCP runner
        run: PYTHONPATH=. python scripts/research/e7_native_vs_mcp_runner.py --manifest research/experiments/e7-native-tools-vs-mcp-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e7-native-tools-vs-mcp-summary.json
      - name: Execute E8 statistical pilot prep validator
        run: PYTHONPATH=. python scripts/research/e8_statistical_pilot_prep.py --manifest research/experiments/e8-statistical-pilot-model-benchmark-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e8-statistical-pilot-prep-summary.json
      - name: Execute E8 free pilot execution smoke
        run: PYTHONPATH=. python scripts/research/e8_free_pilot_runner.py --manifest research/experiments/e8-free-pilot-execution-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e8-free-pilot-execution-summary.json
      - name: Execute E8 free-anywhere candidate discovery
        run: PYTHONPATH=. python scripts/research/e8_free_anywhere_candidate_discovery.py --manifest research/experiments/e8-free-anywhere-candidate-discovery-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e8-free-anywhere-candidate-discovery-summary.json
      - name: Execute E8 free-anywhere real candidate dry-run
        run: PYTHONPATH=. python scripts/research/e8_free_anywhere_model_runner.py --dry-run --provider groq --manifest research/experiments/e8-free-anywhere-real-candidate-run-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e8-free-anywhere-model-dry-run-summary.json
      - name: Execute E8 OpenRouter comparator dry-run
        run: PYTHONPATH=. python scripts/research/e8_free_anywhere_model_runner_v3.py --dry-run --provider openrouter --manifest research/experiments/e8-free-anywhere-real-candidate-run-manifest.json --split-manifest research/frozen/benchmark-split-v1.json --out /tmp/e8-openrouter-comparator-dry-run-summary.json
      - name: Upload E4 DEV model-proposal metrics
        uses: actions/upload-artifact@v4
        with:
          name: e4-dev-model-proposal-boundary
          path: /tmp/e4-dev-model-proposal-boundary.json
      - name: Upload E4 DEV scoreable proposal metrics
        uses: actions/upload-artifact@v4
        with:
          name: e4-dev-scoreable-proposal-boundary
          path: /tmp/e4-dev-scoreable-proposal-boundary.json
      - name: Upload E4 VALIDATION scoreable proposal metrics
        uses: actions/upload-artifact@v4
        with:
          name: e4-validation-scoreable-proposal-boundary
          path: /tmp/e4-validation-scoreable-proposal-boundary.json
      - name: Upload E5 evidence stopping summary
        uses: actions/upload-artifact@v4
        with:
          name: e5-evidence-stopping-summary
          path: /tmp/e5-evidence-stopping-summary.json
      - name: Upload E6 runtime spike summary
        uses: actions/upload-artifact@v4
        with:
          name: e6-runtime-spike-summary
          path: /tmp/e6-runtime-spike-summary.json
      - name: Upload E6 LangGraph integration summary
        uses: actions/upload-artifact@v4
        with:
          name: e6-langgraph-integration-summary
          path: /tmp/e6-langgraph-integration-summary.json
      - name: Upload E6 adaptive ToolSpec LangGraph summary
        uses: actions/upload-artifact@v4
        with:
          name: e6-real-toolspec-langgraph-summary
          path: /tmp/e6-real-toolspec-langgraph-summary.json
      - name: Upload E6 live API integration contract summary
        uses: actions/upload-artifact@v4
        with:
          name: e6-live-api-integration-summary
          path: /tmp/e6-live-api-integration-summary.json
      - name: Upload E7 native tools vs MCP summary
        uses: actions/upload-artifact@v4
        with:
          name: e7-native-tools-vs-mcp-summary
          path: /tmp/e7-native-tools-vs-mcp-summary.json
      - name: Upload E8 statistical pilot prep summary
        uses: actions/upload-artifact@v4
        with:
          name: e8-statistical-pilot-prep-summary
          path: /tmp/e8-statistical-pilot-prep-summary.json
      - name: Upload E8 free pilot execution summary
        uses: actions/upload-artifact@v4
        with:
          name: e8-free-pilot-execution-summary
          path: /tmp/e8-free-pilot-execution-summary.json
      - name: Upload E8 free-anywhere candidate discovery summary
        uses: actions/upload-artifact@v4
        with:
          name: e8-free-anywhere-candidate-discovery-summary
          path: /tmp/e8-free-anywhere-candidate-discovery-summary.json
      - name: Upload E8 free-anywhere model dry-run summary
        uses: actions/upload-artifact@v4
        with:
          name: e8-free-anywhere-model-dry-run-summary
          path: /tmp/e8-free-anywhere-model-dry-run-summary.json
      - name: Upload E8 OpenRouter comparator dry-run summary
        uses: actions/upload-artifact@v4
        with:
          name: e8-openrouter-comparator-dry-run-summary
          path: /tmp/e8-openrouter-comparator-dry-run-summary.json
