name: cloudflare-d02-governed-live-provider-free

on:
  pull_request:
    paths:
      - "src/academy_tractian/cloudflare_provider_d02_live.py"
      - "src/academy_tractian/cloudflare_live_authorization_d02_v1.py"
      - "scripts/research/capture_cloudflare_d02_operator_attestation_evidence_v1.py"
      - "scripts/research/issue_cloudflare_d02_operator_attestation_receipt_v1.py"
      - "scripts/research/execute_cloudflare_d02_live_comparison_operator_attestation_v1.py"
      - "tests/test_cloudflare_d02_governed_live.py"
      - "research/experiments/cloudflare-d02-live-authorization-protocol-v1.json"
      - "docs/adr/027-cloudflare-d02-governed-live-authorization-2026-09-02.md"
      - ".github/workflows/cloudflare-d02-governed-live-provider-free.yml"
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: python -m pip install -e '.[dev]'
      - name: Compile D02 governed live modules and CLIs
        run: |
          python -m py_compile src/academy_tractian/cloudflare_provider_d02_live.py
          python -m py_compile src/academy_tractian/cloudflare_live_authorization_d02_v1.py
          python -m py_compile scripts/research/capture_cloudflare_d02_operator_attestation_evidence_v1.py
          python -m py_compile scripts/research/issue_cloudflare_d02_operator_attestation_receipt_v1.py
          python -m py_compile scripts/research/execute_cloudflare_d02_live_comparison_operator_attestation_v1.py
      - name: D02 governed live provider-free regression
        env:
          CLOUDFLARE_API_TOKEN: ""
          CLOUDFLARE_ACCOUNT_ID: ""
        run: pytest -q tests/test_cloudflare_d02_governed_live.py
      - name: Prove D01 and D02 foundation pins remain unchanged
        shell: bash
        run: |
          test "$(git rev-parse HEAD:research/experiments/provider-model-comparison-design-manifest-v2.json)" = "f70837fca46fa8ecf1e63b33ea41dec73fc051e3"
          test "$(git rev-parse HEAD:research/experiments/provider-model-comparison-dev-population-v1.json)" = "abd6a7d973a8779f425c3607d963e29f15db09e5"
          test "$(git rev-parse HEAD:docs/adr/018-cloudflare-provider-model-comparison-preregistration-2026-08-31.md)" = "e075ab4ff21904b9412769496dd2680c049cdaa8"
          test "$(git rev-parse HEAD:docs/adr/019-cloudflare-provider-client-provider-free-implementation-2026-08-31.md)" = "b8f76831aceb13f5f3ffb5d7da0e12b595d9dd1a"
          test "$(git rev-parse HEAD:src/academy_tractian/cloudflare_provider_client.py)" = "a5c814b519584b6d4346e3b0567bbc3da8ba0bf4"
          test "$(git rev-parse HEAD:research/experiments/cloudflare-d02-completion-budget-protocol-v1.json)" = "eda022821c4ffe08b28b80b814d0da28f84580f6"
          test "$(git rev-parse HEAD:docs/adr/026-cloudflare-d02-completion-budget-amendment-2026-09-02.md)" = "c5d00a1668613cacd3b520cd241a8b969a262119"
          test "$(git rev-parse HEAD:src/academy_tractian/cloudflare_provider_d02.py)" = "c6cc416c4201a30961861c852aaa746e6c5c9113"
