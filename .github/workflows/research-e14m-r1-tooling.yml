name: research-e14m-r1-tooling

on:
  pull_request:
  workflow_dispatch:

jobs:
  e14m-r1-tooling-self-checks:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Validate no-provider local preflight
        run: PYTHONPATH=. python scripts/research/e14m_r1_local_preflight.py --self-check
      - name: Validate safe aggregate result summary
        run: PYTHONPATH=. python scripts/research/e14m_r1_safe_result_summary.py --self-check
