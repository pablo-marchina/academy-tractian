name: frontend-lockfile-generation

on:
  pull_request:
    paths:
      - "frontend/package.json"
      - ".github/workflows/frontend-lockfile-generation.yml"
  push:
    branches:
      - feat/p0-frontend-deterministic-lockfile
    paths:
      - "frontend/package.json"
      - ".github/workflows/frontend-lockfile-generation.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Generate npm lockfile only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify exact prereviewed lockfile digest
        run: echo "a93c1d385a314524fd0ae2e1e0b6a533fad57c3b60bc7447ceabadf8a9af4c93  frontend/package-lock.json" | sha256sum --check --strict
      - name: Validate lockfile is complete
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
      - name: Upload generated lockfile
        uses: actions/upload-artifact@v4
        with:
          name: frontend-package-lock-${{ github.run_id }}
          path: frontend/package-lock.json
          if-no-files-found: error
          retention-days: 7
      - name: Commit validated lockfile to source branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          if git diff --cached --quiet; then
            echo "Validated lockfile already committed"
            exit 0
          fi
          git commit -m "build: freeze frontend npm dependency graph"
          git push origin "HEAD:${GITHUB_REF_NAME}"
