name: research-p12-c1-push-run-observer

on:
  push:
    branches: [research/systematic-foundation]
    paths:
      - '.github/workflows/research-p12-c1-push-run-observer.yml'

permissions:
  actions: read
  contents: read
  statuses: write

jobs:
  publish-target-run-status:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_HEAD_SHA: e3ed60ab5cf00ceeadfbb350b84f2e19286f9240
      TARGET_WORKFLOW_NAME: research-p12-c1-paired-exposed-pool
    steps:
      - name: Locate the non-rerunnable target push run
        id: locate
        shell: bash
        run: |
          set -euo pipefail
          row=''
          for _ in $(seq 1 12); do
            data=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/runs" \
              -f branch=research/systematic-foundation \
              -f event=push \
              -f per_page=100)
            row=$(printf '%s' "$data" | jq -c --arg sha "$TARGET_HEAD_SHA" --arg name "$TARGET_WORKFLOW_NAME" \
              '.workflow_runs[] | select(.head_sha==$sha and .name==$name)' | head -n 1 || true)
            [ -n "$row" ] && break
            sleep 5
          done
          if [ -z "$row" ]; then
            echo 'Target P12-C1 push run not found' >&2
            exit 1
          fi
          run_id=$(printf '%s' "$row" | jq -r '.id')
          status=$(printf '%s' "$row" | jq -r '.status')
          conclusion=$(printf '%s' "$row" | jq -r '.conclusion // ""')
          html_url=$(printf '%s' "$row" | jq -r '.html_url')
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "conclusion=$conclusion" >> "$GITHUB_OUTPUT"
          echo "html_url=$html_url" >> "$GITHUB_OUTPUT"
      - name: Publish discoverable commit status
        shell: bash
        run: |
          set -euo pipefail
          run_id='${{ steps.locate.outputs.run_id }}'
          status='${{ steps.locate.outputs.status }}'
          conclusion='${{ steps.locate.outputs.conclusion }}'
          url='${{ steps.locate.outputs.html_url }}'
          state=pending
          if [ "$status" = completed ]; then
            if [ "$conclusion" = success ]; then state=success; else state=failure; fi
          fi
          desc="target_run=$run_id status=$status"
          [ -n "$conclusion" ] && desc="$desc conclusion=$conclusion"
          gh api -X POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state="$state" \
            -f context='p12-c1-target-run' \
            -f description="$desc" \
            -f target_url="$url" >/dev/null
