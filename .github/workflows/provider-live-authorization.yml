name: provider-live-authorization

on:
  pull_request:
    paths:
      - "src/academy_tractian/provider_clients.py"
      - "src/academy_tractian/decision_source.py"
      - "tests/test_provider_clients.py"
      - "tests/test_provider_live_authorization.py"
      - "research/frozen/provider-model-live-comparison-authorization-v1.json"
      - "research/experiments/provider-model-comparison-design-manifest-v1.json"
      - "research/experiments/provider-model-comparison-dev-population-v1.json"
      - "scripts/research/validate_provider_live_authorization.py"
      - "docs/adr/009-provider-http-clients-live-comparison-authorization-2026-08-28.md"
      - "docs/adr/README.md"
      - ".github/workflows/provider-live-authorization.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-provider-free-authorization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production and controller test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Validate exact authorization packet provider-free
        run: python scripts/research/validate_provider_live_authorization.py
      - name: Run authorization tamper tests
        run: python -m pytest -q tests/test_provider_live_authorization.py tests/test_provider_clients.py
      - name: Regress full production surface
        run: python -m pytest -q tests
      - name: Regress ADR-004 controller boundary
        run: python -m pytest -q research/e2/tests/test_controller.py
