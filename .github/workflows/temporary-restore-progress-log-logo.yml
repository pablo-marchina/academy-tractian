name: temporary-restore-progress-log-logo

on:
  push:
    branches: [eval/c4-logo-sensitivity]
    paths:
      - '.github/workflows/temporary-restore-progress-log-logo.yml'

permissions:
  contents: write

jobs:
  restore-and-append:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: eval/c4-logo-sensitivity
          fetch-depth: 0
      - name: Restore exact pre-LOGO ledger and append LOGO closure
        shell: bash
        run: |
          set -euo pipefail
          git show 14a175d3797bb117a223dc4bf6bf75257e6fa4a0:docs/PROJECT-PROGRESS-LOG.md > docs/PROJECT-PROGRESS-LOG.md
          echo '' | base64 -d >> docs/PROJECT-PROGRESS-LOG.md
          git rm .github/workflows/temporary-restore-progress-log-logo.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/PROJECT-PROGRESS-LOG.md
          git commit -m "docs: preserve detailed ledger and append C4 LOGO closure"
          git push origin HEAD:eval/c4-logo-sensitivity
