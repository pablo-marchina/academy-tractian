name: e2e-stream-state-patch

on:
  push:
    branches:
      - feat/p0-playwright-full-product-e2e
    paths:
      - ".github/workflows/e2e-stream-state-patch.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply exact catch-up state patch
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected patch anchor missing: {path}")
              if text.count(old) != 1:
                  raise SystemExit(f"patch anchor not unique: {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/academy_tractian/observability_api.py",
              '''def _sse_record(event: dict[str, object]) -> str:\n    payload = json.dumps(event, sort_keys=True, separators=(",", ":"), default=str)\n    return f"id: {event['event_id']}\\nevent: trace_event\\ndata: {payload}\\n\\n"\n''',
              '''def _sse_record(event: dict[str, object]) -> str:\n    payload = json.dumps(event, sort_keys=True, separators=(",", ":"), default=str)\n    return f"id: {event['event_id']}\\nevent: trace_event\\ndata: {payload}\\n\\n"\n\n\ndef _sse_stream_state_record(*, run_id: str, state: str, after_sequence: int) -> str:\n    payload = json.dumps(\n        {"run_id": run_id, "state": state, "after_sequence": after_sequence},\n        sort_keys=True,\n        separators=(",", ":"),\n    )\n    # Transport-control state deliberately carries no SSE id so the browser's Last-Event-ID\n    # remains the last persisted trace event and reconnect resumes from the canonical cursor.\n    return f"event: stream_state\\ndata: {payload}\\n\\n"\n''',
          )
          replace_once(
              "src/academy_tractian/observability_api.py",
              '''        async def event_stream():\n            nonlocal after_sequence\n            close_reason: CloseReason = "client_disconnect"\n            try:\n                while True:\n''',
              '''        async def event_stream():\n            nonlocal after_sequence\n            close_reason: CloseReason = "client_disconnect"\n            reconnect_catchup_pending = bool(last_event_id)\n            try:\n                while True:\n''',
          )
          replace_once(
              "src/academy_tractian/observability_api.py",
              '''                        yield _sse_record(item)\n\n                    current = store.get_run(run_id)\n''',
              '''                        yield _sse_record(item)\n\n                    if reconnect_catchup_pending:\n                        yield _sse_stream_state_record(\n                            run_id=run_id,\n                            state="caught_up",\n                            after_sequence=after_sequence,\n                        )\n                        reconnect_catchup_pending = False\n\n                    current = store.get_run(run_id)\n''',
          )

          replace_once(
              "frontend/src/state/runEvents.ts",
              '''  | "live"\n  | "reconnecting"\n  | "completed"\n''',
              '''  | "live"\n  | "reconnecting"\n  | "caught_up"\n  | "completed"\n''',
          )

          replace_once(
              "frontend/src/hooks/useLiveRun.ts",
              '''function parseSafeEvent(value: string): SafeEvent {\n''',
              '''interface StreamStateMessage {\n  run_id: string;\n  state: "caught_up";\n  after_sequence: number;\n}\n\nfunction parseStreamState(value: string): StreamStateMessage {\n  const parsed = JSON.parse(value) as Partial<StreamStateMessage>;\n  if (\n    typeof parsed.run_id !== "string" ||\n    parsed.state !== "caught_up" ||\n    typeof parsed.after_sequence !== "number"\n  ) {\n    throw new Error("invalid_stream_state");\n  }\n  return parsed as StreamStateMessage;\n}\n\nfunction parseSafeEvent(value: string): SafeEvent {\n''',
          )
          replace_once(
              "frontend/src/hooks/useLiveRun.ts",
              '''      source.onopen = () => {\n        setError(null);\n        setConnection("live");\n      };\n\n      source.addEventListener("trace_event", (message) => {\n''',
              '''      source.onopen = () => {\n        setError(null);\n        setConnection((current) => (current === "reconnecting" ? current : "live"));\n      };\n\n      source.addEventListener("stream_state", (message) => {\n        try {\n          const state = parseStreamState((message as MessageEvent<string>).data);\n          if (state.run_id !== run.run_id) throw new Error("cross_run_stream_state_rejected");\n          setConnection("caught_up");\n        } catch (cause) {\n          source.close();\n          if (sourceRef.current === source) sourceRef.current = null;\n          setConnection("failed");\n          setError(cause instanceof Error ? cause.message : "invalid_stream_state");\n        }\n      });\n\n      source.addEventListener("trace_event", (message) => {\n''',
          )
          replace_once(
              "frontend/src/hooks/useLiveRun.ts",
              '''          if (incoming.run_id !== run.run_id) throw new Error("cross_run_event_rejected");\n          setEvents((current) => {\n''',
              '''          if (incoming.run_id !== run.run_id) throw new Error("cross_run_event_rejected");\n          setConnection((current) => (current === "caught_up" ? "live" : current));\n          setEvents((current) => {\n''',
          )

          replace_once(
              "frontend/src/App.tsx",
              '''          <div><span className="metric-label">View</span><strong>{viewingHistorical ? "historical" : live.accepted ? "live" : "idle"}</strong></div>\n          <div><span className="metric-label">Stream / execution</span><strong>{viewingHistorical ? "persisted" : `${live.connection} / ${executionQuery.data?.status ?? (live.accepted ? "accepted" : "—")}`}</strong></div>\n''',
              '''          <div><span className="metric-label">View</span><strong>{viewingHistorical ? "HISTORICAL" : live.accepted ? "LIVE" : "IDLE"}</strong></div>\n          <div><span className="metric-label">Stream / execution</span><strong>{viewingHistorical ? "HISTORICAL" : `${live.connection.toUpperCase()} / ${executionQuery.data?.status ?? (live.accepted ? "accepted" : "—")}`}</strong></div>\n''',
          )
          PY

      - name: Validate frontend patch
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Validate Python patch
        run: |
          python -m py_compile src/academy_tractian/observability_api.py

      - name: Commit validated patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/academy_tractian/observability_api.py frontend/src/state/runEvents.ts frontend/src/hooks/useLiveRun.ts frontend/src/App.tsx
          git commit -m "feat: expose safe SSE catch-up connection state"
          git push origin "HEAD:${GITHUB_REF_NAME}"
