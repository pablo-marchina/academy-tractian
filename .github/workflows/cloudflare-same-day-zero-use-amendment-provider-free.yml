name: cloudflare-same-day-zero-use-amendment-provider-free

on:
  pull_request:
    paths:
      - "research/experiments/cloudflare-live-authorization-same-day-zero-use-amendment-v1.json"
      - "src/academy_tractian/cloudflare_live_authorization_same_day_v3.py"
      - "scripts/research/capture_cloudflare_same_day_zero_use_evidence_v1.py"
      - "scripts/research/issue_cloudflare_same_day_zero_use_receipt_v1.py"
      - "scripts/research/execute_cloudflare_live_comparison_same_day_v1.py"
      - "scripts/research/validate_cloudflare_same_day_zero_use_amendment_v1.py"
      - "tests/test_cloudflare_live_authorization_same_day_v3.py"
      - "tests/test_cloudflare_same_day_governed_live_entrypoint.py"
      - "docs/adr/024-cloudflare-same-day-zero-use-neuron-evidence-amendment-2026-09-01.md"
      - ".github/workflows/cloudflare-same-day-zero-use-amendment-provider-free.yml"
  workflow_dispatch:

jobs:
  provider-free-amendment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production and E2 dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Validate frozen same-day amendment
        run: python scripts/research/validate_cloudflare_same_day_zero_use_amendment_v1.py
      - name: Run same-day and preserved reset-window regressions
        run: |
          python -m pytest -q \
            tests/test_cloudflare_live_authorization_same_day_v3.py \
            tests/test_cloudflare_same_day_governed_live_entrypoint.py \
            tests/test_cloudflare_live_authorization_reset_v2.py \
            tests/test_cloudflare_governed_live_entrypoint.py
