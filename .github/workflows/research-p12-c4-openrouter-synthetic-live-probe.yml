name: research-p12-c4-openrouter-synthetic-live-probe

on:
  push:
    branches: [research/systematic-foundation]
    paths:
      - 'research/frozen/p12-c4-openrouter-synthetic-probe-live-authorization-v1.json'

permissions:
  contents: read

concurrency:
  group: research-p12-c4-openrouter-synthetic-live-probe
  cancel-in-progress: false

jobs:
  exactly-one-openrouter-synthetic-probe-attempt:
    if: ${{ github.run_attempt == 1 }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Assert one-shot trigger and frozen artifacts
        run: |
          test "${{ github.run_attempt }}" = "1"
          test -n "${OPENROUTER_API_KEY:-}"
          test -f research/frozen/p12-c4-openrouter-synthetic-probe-live-authorization-v1.json
          test -f research/experiments/p12-c4-openrouter-provider-serving-contract-v1.json
          test -f research/experiments/p12-c4-openrouter-synthetic-compatibility-probe-preregistration-v1.json
          test -f research/frozen/p12-c4-openrouter-request-budget-and-pacing-v1.json
          test -f research/results/p12-c4-cerebras-synthetic-live-probe-closure-2026-08-25.json
      - name: Install exact frozen transport
        run: |
          python -m pip install --disable-pip-version-check 'httpx==0.28.1'
          python - <<'PY'
          import importlib.metadata
          assert importlib.metadata.version('httpx') == '0.28.1'
          print('OPENROUTER_HTTPX_PIN_PASS')
          PY
      - name: Compile live runner
        run: python -m py_compile scripts/research/p12_c4_openrouter_synthetic_probe.py
      - name: Validate one-shot authorization without provider call
        run: |
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          p=Path('scripts/research/p12_c4_openrouter_synthetic_probe.py')
          spec=importlib.util.spec_from_file_location('probe',p)
          m=importlib.util.module_from_spec(spec); spec.loader.exec_module(m)
          z=m.check_auth(Path('research/frozen/p12-c4-openrouter-synthetic-probe-live-authorization-v1.json'))
          assert z['authorized_attempts']==1
          assert z['github_actions_run_attempt_required']==1
          assert z['rerun_allowed'] is False
          assert z['automatic_retry_allowed'] is False
          assert z['provider_fallback_allowed'] is False
          assert z['model_fallback_allowed'] is False
          assert z['prior_cerebras_authorization_reuse_allowed'] is False
          assert z['exposed_pool_live_generation_authorized'] is False
          print('P12_C4_OPENROUTER_SYNTHETIC_LIVE_PREFLIGHT_PASS')
          PY
      - name: Execute at most two preregistered synthetic calls
        run: |
          python scripts/research/p12_c4_openrouter_synthetic_probe.py \
            --authorization research/frozen/p12-c4-openrouter-synthetic-probe-live-authorization-v1.json \
            --output /tmp/p12-c4-openrouter-synthetic-compatibility-probe-result.json
      - name: Require exact 2-of-2 semantic PASS
        run: |
          python - <<'PY'
          import json
          x=json.load(open('/tmp/p12-c4-openrouter-synthetic-compatibility-probe-result.json',encoding='utf-8'))
          assert x['status']=='PASS'
          assert x['provider_calls']==2
          assert x['provider_request_attempts']==2
          assert x['successful_http_responses']==2
          assert x['model_outputs_observed']==2
          assert x['automatic_retries']==0
          assert x['provider_fallbacks']==0
          assert x['model_fallbacks']==0
          assert x['benchmark_inputs_loaded']==0
          assert x['private_oracle_accesses']==0
          assert x['fresh_blind_accesses']==0
          assert x['legacy_locked_test_accesses']==0
          assert len(x['calls'])==2
          assert all(''.join(ch for ch in c['provider_identifier'].lower() if ch.isalnum())=='openinference' for c in x['calls'])
          assert x['exposed_pool_live_generation_authorized_by_this_result'] is False
          print('P12_C4_OPENROUTER_SYNTHETIC_2_OF_2_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p12-c4-openrouter-synthetic-compatibility-probe-result-v1
          path: /tmp/p12-c4-openrouter-synthetic-compatibility-probe-result.json
          retention-days: 90
          if-no-files-found: warn
