name: cloudflare-reset-window-evidence-capture-provider-free

on:
  pull_request:
    paths:
      - src/academy_tractian/cloudflare_reset_window_capture_v1.py
      - scripts/research/capture_cloudflare_reset_window_evidence_v1.py
      - tests/test_cloudflare_reset_window_capture_v1.py
      - src/academy_tractian/cloudflare_live_authorization_reset_v2.py
      - scripts/research/issue_cloudflare_reset_window_receipt_v1.py
      - tests/test_cloudflare_live_authorization_reset_v2.py
      - docs/adr/022-cloudflare-reset-window-neuron-evidence-amendment-2026-09-01.md
      - docs/NEXT-STEPS.md
      - .github/workflows/cloudflare-reset-window-evidence-capture-provider-free.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-evidence-capture-helper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ensure provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
      - name: Verify CLI has no clock override
        shell: bash
        run: |
          python scripts/research/capture_cloudflare_reset_window_evidence_v1.py --help > /tmp/help.txt
          ! grep -E -- '--now|--time|--date|--reset' /tmp/help.txt
      - name: Run evidence capture helper tests
        run: python -m pytest -q tests/test_cloudflare_reset_window_capture_v1.py
      - name: Preserve ADR-022 reset-window regressions
        run: python -m pytest -q tests/test_cloudflare_live_authorization_reset_v2.py
      - name: Preserve ADR-021 authorization regressions
        run: python -m pytest -q tests/test_cloudflare_live_authorization_v1.py
      - name: Preserve Cloudflare executor/client/provenance regressions
        run: python -m pytest -q tests/test_cloudflare_provider_comparison_v2.py tests/test_cloudflare_provider_provenance_v2.py tests/test_cloudflare_provider_client.py
