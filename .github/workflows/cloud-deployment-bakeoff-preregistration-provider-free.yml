name: cloud-deployment-bakeoff-preregistration-provider-free

on:
  pull_request:
    paths:
      - "research/experiments/cloud-deployment-bakeoff-preregistration-v1.json"
      - "src/academy_tractian/deployment_bakeoff.py"
      - "src/academy_tractian/deployment_feasibility.py"
      - "src/academy_tractian/hosted_state_identity_pilot.py"
      - "src/academy_tractian/live_deployment_attestation.py"
      - "src/academy_tractian/load_concurrency_benchmark.py"
      - "scripts/validate_cloud_deployment_bakeoff_preregistration.py"
      - "tests/test_deployment_bakeoff.py"
      - "tests/test_deployment_feasibility_research_snapshot.py"
      - "tests/test_managed_state_identity_static_screening.py"
      - "tests/test_hosted_state_identity_pilot.py"
      - "tests/test_live_deployment_attestation.py"
      - ".github/workflows/cloud-deployment-bakeoff-preregistration-provider-free.yml"
  push:
    branches:
      - main
    paths:
      - "research/experiments/cloud-deployment-bakeoff-preregistration-v1.json"
      - "src/academy_tractian/deployment_bakeoff.py"
      - "scripts/validate_cloud_deployment_bakeoff_preregistration.py"
      - "tests/test_deployment_bakeoff.py"
      - ".github/workflows/cloud-deployment-bakeoff-preregistration-provider-free.yml"

permissions:
  contents: read

concurrency:
  group: cloud-deployment-bakeoff-preregistration-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  provider-free-preregistration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Validate immutable provider-free preregistration and workflow surface
        run: python scripts/validate_cloud_deployment_bakeoff_preregistration.py

      - name: Regress bakeoff and prerequisite hard gates
        run: >-
          python -m pytest -q
          tests/test_deployment_bakeoff.py
          tests/test_deployment_feasibility_research_snapshot.py
          tests/test_managed_state_identity_static_screening.py
          tests/test_hosted_state_identity_pilot.py
          tests/test_live_deployment_attestation.py
