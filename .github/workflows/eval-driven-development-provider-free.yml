name: eval-driven-development-provider-free

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-driven-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Eval-driven, operational-value, semantic-calibration and safe-observability contract tests
        run: >-
          python -m pytest -q
          tests/test_eval_driven.py
          tests/test_operational_value.py
          tests/test_operational_value_integrity.py
          tests/test_operational_value_pilot.py
          tests/test_operational_value_pilot_integrity.py
          tests/test_operational_value_collection.py
          tests/test_operational_value_analysis.py
          tests/test_semantic_evaluation.py
          tests/test_semantic_human_calibration.py
          tests/test_observability.py
      - name: Compile evaluation CLIs
        run: >-
          python -m py_compile
          scripts/eval_driven_compare.py
          scripts/operational_value_report.py
          scripts/operational_value_pilot.py
          scripts/operational_value_analyze.py
          scripts/semantic_eval_calibrate.py
          scripts/semantic_human_calibration.py
