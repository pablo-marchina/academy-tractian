name: eval-driven-development-provider-free

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-driven-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Eval-driven contract tests
        run: python -m pytest -q tests/test_eval_driven.py
      - name: Compile comparison CLI
        run: python -m py_compile scripts/eval_driven_compare.py
