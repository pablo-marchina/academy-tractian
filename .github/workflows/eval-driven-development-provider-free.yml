name: eval-driven-development-provider-free

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  eval-driven-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Eval-driven, semantic-calibration, adaptive-candidate and safe-observability contract tests
        run: >-
          python -m pytest -q
          tests/test_eval_driven.py
          tests/test_semantic_evaluation.py
          tests/test_adaptive_policy.py
          tests/test_adaptive_policy_edd.py
          tests/test_observability.py
      - name: Compile evaluation and candidate policy modules
        run: >-
          python -m py_compile
          scripts/eval_driven_compare.py
          scripts/semantic_eval_calibrate.py
          src/academy_tractian/adaptive_policy.py
