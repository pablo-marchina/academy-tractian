name: provider-tournament-cross-provider-v1-live

on:
  push:
    branches:
      - fix/functional-acceptance-closure
    paths:
      - "src/academy_tractian/provider_tournament_cross_provider_v1.py"
      - "tests/test_provider_tournament_cross_provider_v1.py"
      - "scripts/research/run_provider_tournament_cross_provider_v1.py"
      - "research/experiments/provider-tournament-cross-provider-v1-manifest.json"
      - ".github/workflows/provider-tournament-cross-provider-v1-live.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  provider-free-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Compile DP-005 implementation
        run: |
          python -m py_compile \
            src/academy_tractian/provider_tournament_cross_provider_v1.py \
            scripts/research/run_provider_tournament_cross_provider_v1.py
      - name: Run provider-free DP-005 gates
        run: pytest -q tests/test_provider_tournament_cross_provider_v1.py

  live-tournament:
    needs: provider-free-contract
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      DP005_OUTPUT_DIR: artifacts/provider-tournament-cross-provider-v1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: python -m pip install -e '.[dev]'
      - name: Assert hosted secrets are present without printing them
        shell: bash
        run: |
          test -n "${GROQ_API_KEY:-}"
          test -n "${NVIDIA_API_KEY:-}"
          test -n "${OPENROUTER_API_KEY:-}"
      - name: Execute frozen-contract DP-005 live tournament
        run: python scripts/research/run_provider_tournament_cross_provider_v1.py
      - name: Upload sanitized DP-005 evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-tournament-cross-provider-v1-evidence
          path: artifacts/provider-tournament-cross-provider-v1/
          if-no-files-found: warn
          retention-days: 30
