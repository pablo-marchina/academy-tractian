name: postgres-production-operational

on:
  pull_request:
    paths:
      - "src/academy_tractian/postgres_*.py"
      - "src/academy_tractian/product_api.py"
      - "src/academy_tractian/action_product_api.py"
      - "src/academy_tractian/operational_value_collection.py"
      - "src/academy_tractian/operational_value_pilot.py"
      - "src/academy_tractian/operational_value_analysis.py"
      - "src/academy_tractian/action_recovery.py"
      - "src/academy_tractian/run_access.py"
      - "src/academy_tractian/run_execution_store.py"
      - "scripts/operational_value_analyze.py"
      - "tests/test_postgres_product_api.py"
      - "tests/test_postgres_operational_value_collection.py"
      - "tests/test_postgres_operational_value_v5.py"
      - "tests/test_postgres_operational_value_analysis.py"
      - "tests/test_operational_value_collection.py"
      - "tests/test_operational_value_analysis.py"
      - "pyproject.toml"
      - ".github/workflows/postgres-production-operational.yml"
  workflow_dispatch:

jobs:
  postgres-product-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_tractian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_tractian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_OPERATIONAL_TEST_DSN: postgresql://postgres:postgres@127.0.0.1:5432/academy_tractian
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Run promoted PostgreSQL product integration
        run: >-
          python -m pytest -q
          tests/test_postgres_product_api.py
          tests/test_postgres_operational_value_collection.py
          tests/test_postgres_operational_value_v5.py
          tests/test_postgres_operational_value_analysis.py

      - name: Regress existing operational product contracts
        run: >-
          python -m pytest -q
          tests/test_operational_value_collection.py
          tests/test_operational_value_analysis.py
          tests/test_multiuser_product_api.py
          tests/test_product_api.py
          tests/test_production_operability.py
          tests/test_action_product_api.py
          tests/test_action_recovery.py
          tests/test_run_execution_store.py

      - name: Import production PostgreSQL constructor from installed package
        run: |
          python - <<'PY'
          from academy_tractian.postgres_product_api import (
              create_postgres_action_capable_product_app,
              initialize_postgres_operational_schema,
              register_postgres_operational_pilot_packet,
          )
          from academy_tractian.postgres_operational_value_analysis import (
              PostgresOperationalValueAnalysisStore,
          )
          assert callable(create_postgres_action_capable_product_app)
          assert callable(initialize_postgres_operational_schema)
          assert callable(register_postgres_operational_pilot_packet)
          assert PostgresOperationalValueAnalysisStore is not None
          print("PostgreSQL production constructor import passed")
          PY
