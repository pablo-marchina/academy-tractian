name: research-p12-c2-export-parent-runner

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/research-p12-c2-export-parent-runner.yml'
      - 'research/experiments/p12-c2-parent-runner-export-trigger-v1.json'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Export exact qualified P12-C1 runner source
        run: |
          mkdir -p /tmp/p12-c2-parent
          git hash-object research/execution-bundles/p12-c1/p12_c1_paired_exposed_pool_execution.py.gz | grep -Fx 'a5c27394014bac656faa0a2f923a5c5da72d66f5'
          gzip -dc research/execution-bundles/p12-c1/p12_c1_paired_exposed_pool_execution.py.gz > /tmp/p12-c2-parent/p12_c1_paired_exposed_pool_execution.py
          echo 'be16ec6d2c33ad68134a0fbf7aa280b4103ee411b01233b6de7a76668e899a50  /tmp/p12-c2-parent/p12_c1_paired_exposed_pool_execution.py' | sha256sum -c -
          python -m py_compile /tmp/p12-c2-parent/p12_c1_paired_exposed_pool_execution.py
      - uses: actions/upload-artifact@v4
        with:
          name: p12-c2-qualified-parent-runner-source
          path: /tmp/p12-c2-parent/p12_c1_paired_exposed_pool_execution.py
          retention-days: 7
          if-no-files-found: error
