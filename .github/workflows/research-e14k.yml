name: research-e14k-dev-only-high-reasoning-4096-completion-budget

on:
  push:
    branches:
      - research/systematic-foundation
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e14k-dev-only-4096-budget-dry-run:
    runs-on: ubuntu-24.04
    env:
      E8_GROQ_MODEL: openai/gpt-oss-120b
      E8_MODEL_TEMPERATURE: "0"
      E14_REASONING_EFFORT: high
      E14_REASONING_FORMAT: hidden
      E14_RESPONSE_FORMAT_MODE: json_schema_strict
      E14_MAX_COMPLETION_TOKENS: "4096"
      E8_BETWEEN_CALL_DELAY_SECONDS: "25"
      E14F_REPAIR_DELAY_SECONDS: "25"
      E14_MAX_RETRIES: "2"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Validate frozen strict public schema
        run: PYTHONPATH=. python scripts/research/e14j_strict_output_schema.py
      - name: Execute E14k DEV-only structural dry-run
        run: >-
          PYTHONPATH=. python scripts/research/e14k_dev_only_high_reasoning_4096_completion_budget.py
          --manifest research/experiments/e14k-dev-only-high-reasoning-4096-completion-budget-manifest.json
          --split-manifest research/frozen/benchmark-split-v1.json
          --out /tmp/e14k-dev-only-4096-budget-dry-run.json
          --dry-run
      - name: Upload E14k dry-run summary
        uses: actions/upload-artifact@v4
        with:
          name: e14k-dev-only-4096-budget-dry-run
          path: /tmp/e14k-dev-only-4096-budget-dry-run.json
