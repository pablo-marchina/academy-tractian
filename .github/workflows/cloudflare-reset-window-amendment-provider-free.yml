name: cloudflare-reset-window-amendment-provider-free

on:
  pull_request:
    paths:
      - research/experiments/cloudflare-live-authorization-reset-window-amendment-v1.json
      - research/results/cloudflare-reset-window-amendment-provider-free-validation-2026-09-01.json
      - src/academy_tractian/cloudflare_live_authorization_reset_v2.py
      - scripts/research/validate_cloudflare_reset_window_amendment_v1.py
      - scripts/research/issue_cloudflare_reset_window_receipt_v1.py
      - tests/test_cloudflare_live_authorization_reset_v2.py
      - docs/adr/021-cloudflare-live-execution-authorization-protocol-2026-09-01.md
      - docs/adr/022-cloudflare-reset-window-neuron-evidence-amendment-2026-09-01.md
      - docs/CURRENT-PROJECT-STATUS.md
      - docs/NEXT-STEPS.md
      - docs/PROJECT-PLAN.md
      - docs/ARCHITECTURE-ROADMAP.md
      - docs/progress/043-cloudflare-reset-window-evidence-amendment-2026-09-01.md
      - .github/workflows/cloudflare-reset-window-amendment-provider-free.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reset-window-amendment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ensure provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
      - name: Validate reset-window amendment protocol
        run: python scripts/research/validate_cloudflare_reset_window_amendment_v1.py
      - name: Run reset-window authorization tests
        run: python -m pytest -q tests/test_cloudflare_live_authorization_reset_v2.py
      - name: Preserve ADR-021 authorization regressions
        run: python -m pytest -q tests/test_cloudflare_live_authorization_v1.py
      - name: Preserve Cloudflare executor/client/provenance regressions
        run: python -m pytest -q tests/test_cloudflare_provider_comparison_v2.py tests/test_cloudflare_provider_provenance_v2.py tests/test_cloudflare_provider_client.py
