name: cloudflare-reset-window-amendment-provider-free

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-reset-window-amendment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install project
        run: python -m pip install -e ".[dev]"
      - name: Ensure provider credentials are absent
        shell: bash
        run: |
          test -z "${CLOUDFLARE_API_TOKEN:-}"
          test -z "${CLOUDFLARE_ACCOUNT_ID:-}"
          test -z "${OPENAI_API_KEY:-}"
          test -z "${GEMINI_API_KEY:-}"
          test -z "${GROQ_API_KEY:-}"
      - name: Validate reset-window amendment protocol
        run: python scripts/research/validate_cloudflare_reset_window_amendment_v1.py
      - name: Run reset-window authorization tests
        run: python -m pytest -q tests/test_cloudflare_live_authorization_reset_v2.py
      - name: Preserve ADR-021 authorization regressions
        run: python -m pytest -q tests/test_cloudflare_live_authorization_v1.py
      - name: Preserve Cloudflare executor/client/provenance regressions
        run: python -m pytest -q tests/test_cloudflare_provider_comparison_v2.py tests/test_cloudflare_provider_provenance_v2.py tests/test_cloudflare_provider_client.py
