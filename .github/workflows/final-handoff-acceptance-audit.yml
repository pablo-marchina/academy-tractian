name: final-handoff-acceptance-audit

on:
  push:
    branches:
      - delivery/final-handoff-acceptance-audit
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-handoff-acceptance-audit-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  final-handoff-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install production and E2 dependencies
        run: python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Production tests
        run: |
          mkdir -p .runtime/ci
          python -m pytest -q tests --junitxml=.runtime/ci/production-tests.xml
      - name: Upload production test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-handoff-production-tests-${{ github.run_id }}
          path: .runtime/ci/production-tests.xml
          if-no-files-found: warn
          retention-days: 14
      - name: ADR-004 controller regression
        run: python -m pytest -q research/e2/tests/test_controller.py
      - name: EV-007 frozen failure campaign
        run: python scripts/validate_ev007_failure_campaign.py
      - name: EV-008 frozen stability campaign
        run: python scripts/validate_ev008_stability_campaign.py
      - name: EV-011 frozen communication campaign
        run: python scripts/validate_ev011_communication_campaign.py
      - name: ADR-016 clean delivery reproduction
        run: python scripts/validate_delivery_reproduction.py
      - name: Final handoff acceptance audit
        run: python scripts/validate_final_handoff_audit.py
