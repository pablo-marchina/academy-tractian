name: production-runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-production.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "research/e2/**"
      - ".github/workflows/production-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements-production.lock"
      - "Dockerfile"
      - ".dockerignore"
      - "research/e2/**"
      - ".github/workflows/production-runtime.yml"
  workflow_dispatch:

jobs:
  production-runtime-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and E2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Run production runtime tests
        run: python -m pytest -q tests

      - name: Regress accepted ADR-004 controller boundary
        run: python -m pytest -q research/e2/tests/test_controller.py

  standalone-wheel-smoke:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: academy_tractian
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d academy_tractian"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      POSTGRES_ADMIN_DSN: postgresql://postgres:postgres@127.0.0.1:5432/academy_tractian
      POSTGRES_SCOPED_DSN: postgresql://academy_wheel_scoped:academy-wheel-scoped@127.0.0.1:5432/academy_tractian
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build production wheel with pinned backend
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install frozen production runtime plus application wheel
        run: |
          python -m venv /tmp/academy-tractian-wheel
          /tmp/academy-tractian-wheel/bin/python -m pip install --upgrade pip
          /tmp/academy-tractian-wheel/bin/python -m pip install -r requirements-production.lock
          /tmp/academy-tractian-wheel/bin/python -m pip install --no-deps dist/academy_tractian-*.whl
          /tmp/academy-tractian-wheel/bin/python -m pip check

      - name: Prove runtime matches the frozen lock and excludes dev-only packages
        run: |
          /tmp/academy-tractian-wheel/bin/python - <<'PY'
          from importlib.metadata import version
          import importlib.util
          from pathlib import Path

          expected = {}
          for raw in Path("requirements-production.lock").read_text(encoding="utf-8").splitlines():
              line = raw.strip()
              if not line or line.startswith("#"):
                  continue
              name, pinned = line.split("==", 1)
              expected[name] = pinned
          observed = {name: version(name) for name in expected}
          assert observed == expected, (expected, observed)
          assert importlib.util.find_spec("duckdb") is None, "DuckDB leaked into production dependencies"
          assert importlib.util.find_spec("httpx") is None, "httpx leaked into production dependencies"
          print("frozen production dependency lock verified")
          PY

      - name: Smoke test promoted production imports outside repository checkout
        working-directory: /tmp
        run: |
          /tmp/academy-tractian-wheel/bin/python - <<'PY'
          import importlib.util

          assert importlib.util.find_spec("duckdb") is None

          from academy_tractian import ProductionRuntimeConfig, canonical_tool_registry
          from academy_tractian.authenticated_postgres_product_api import (
              create_authenticated_postgres_action_capable_product_app,
          )
          from academy_tractian.postgres_product_api import create_postgres_action_capable_product_app
          from academy_tractian.production_config import RemoteProductionConfig
          from academy_tractian.remote_migrate import migrate
          from academy_tractian.remote_production import create_remote_production_app
          from academy_tractian.remote_server import app_factory
          from research.e2.controller import AgentController

          registry = canonical_tool_registry()
          assert len(registry) == 18
          assert ProductionRuntimeConfig().actions_enabled is False
          assert AgentController.__name__ == "AgentController"
          assert callable(create_postgres_action_capable_product_app)
          assert callable(create_authenticated_postgres_action_capable_product_app)
          assert callable(RemoteProductionConfig.from_env)
          assert callable(create_remote_production_app)
          assert callable(app_factory)
          assert callable(migrate)
          print("standalone no-DuckDB remote-production wheel import smoke passed")
          PY

      - name: Create non-owner scoped PostgreSQL role
        working-directory: /tmp
        run: |
          /tmp/academy-tractian-wheel/bin/python - <<'PY'
          import os
          import psycopg

          with psycopg.connect(os.environ["POSTGRES_ADMIN_DSN"], autocommit=True) as connection:
              connection.execute(
                  "CREATE ROLE academy_wheel_scoped LOGIN PASSWORD 'academy-wheel-scoped' NOSUPERUSER NOBYPASSRLS"
              )
          print("scoped wheel-smoke role created")
          PY

      - name: Boot promoted PostgreSQL product with DuckDB absent
        working-directory: /tmp
        run: |
          /tmp/academy-tractian-wheel/bin/python - <<'PY'
          import importlib.util
          import os

          assert importlib.util.find_spec("duckdb") is None

          from academy_tractian.postgres_product_api import create_postgres_action_capable_product_app

          app = create_postgres_action_capable_product_app(
              internal_dsn=os.environ["POSTGRES_ADMIN_DSN"],
              scoped_dsn=os.environ["POSTGRES_SCOPED_DSN"],
              decision_source_factory=lambda: None,
              transport_factory=lambda: None,
              context_provider=lambda _request: None,
              authorization_resolver=lambda **_kwargs: None,
              schema="academy_wheel_smoke",
              initialize_schema=True,
          )
          try:
              assert app.state.local_test_storage_enabled is False
              assert app.state.observability_backend == "postgresql"
              assert app.state.operational_backend == "postgresql"
              assert app.state.observability_store.ready() is True
              assert app.state.run_access_store.ready() is True
              assert app.state.run_execution_store.ready() is True
              assert importlib.util.find_spec("duckdb") is None
              print("standalone no-DuckDB PostgreSQL product boot passed")
          finally:
              app.state.postgres_operational_database.close()
          PY

  remote-production-image-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Assert immutable multi-architecture Python base
        run: |
          grep -F 'python:3.11.16-slim-bookworm@sha256:528257d48c1da0dcecc2e725d1ae34498d60c965f1241e39cd6a85a8859bdf84' Dockerfile

      - name: Build provider-neutral production image
        run: |
          docker build \
            --build-arg ACADEMY_RELEASE_GIT_SHA="${GITHUB_SHA}" \
            --build-arg ACADEMY_BUILD_ID="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --tag academy-tractian-remote:${GITHUB_SHA} \
            .

      - name: Verify release identity and non-root runtime contract
        run: |
          IMAGE="academy-tractian-remote:${GITHUB_SHA}"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "${GITHUB_SHA}"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "academy.tractian.cost-policy"}}')" = "usd0-hard-gate"
          test "$(docker image inspect "$IMAGE" --format '{{index .Config.Labels "academy.tractian.provider-selection"}}')" = "NO_SELECTION"
          test "$(docker image inspect "$IMAGE" --format '{{.Config.User}}')" = "10001:10001"
          test "$(docker run --rm --entrypoint sh "$IMAGE" -c 'id -u')" = "10001"
          test "$(docker run --rm --entrypoint sh "$IMAGE" -c 'id -g')" = "10001"

      - name: Verify production-only dependency surface inside image
        run: |
          IMAGE="academy-tractian-remote:${GITHUB_SHA}"
          docker run --rm --entrypoint python "$IMAGE" - <<'PY'
          import importlib.util
          from academy_tractian.production_config import RemoteProductionConfig
          from academy_tractian.remote_migrate import migrate
          from academy_tractian.remote_server import app_factory

          assert importlib.util.find_spec("duckdb") is None
          assert importlib.util.find_spec("httpx") is None
          assert callable(RemoteProductionConfig.from_env)
          assert callable(migrate)
          assert callable(app_factory)
          print("production image runtime surface verified")
          PY

      - name: Prove serving image fails closed without production environment
        run: |
          IMAGE="academy-tractian-remote:${GITHUB_SHA}"
          if docker run --rm "$IMAGE" > /tmp/remote-production-boot.log 2>&1; then
            cat /tmp/remote-production-boot.log
            echo "production image unexpectedly booted without mandatory remote configuration" >&2
            exit 1
          fi
          grep -F "missing required production environment variables" /tmp/remote-production-boot.log
          echo "remote production image fail-closed boot verified"
