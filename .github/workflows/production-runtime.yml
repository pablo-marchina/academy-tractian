name: production-runtime

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "research/e2/**"
      - ".github/workflows/production-runtime.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "research/e2/**"
      - ".github/workflows/production-runtime.yml"

concurrency:
  group: production-runtime-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  production-runtime-unit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install production and E2 test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      # Diagnostic groups are intentionally non-authoritative. They keep the final full-suite gate
      # unchanged while making failures attributable when a broad regression surface moves.
      - name: Diagnose hosted provider and provenance regressions
        continue-on-error: true
        run: >-
          python -m pytest -q
          tests/test_cloudflare_hosted_provenance.py
          tests/test_hosted_provider.py
          tests/test_provider_frontier_v3.py
          tests/test_model_call_provenance.py

      - name: Diagnose historical provider authorization regressions
        continue-on-error: true
        run: >-
          python -m pytest -q
          tests/test_provider_live_authorization.py
          tests/test_provider_promotion.py

      - name: Diagnose freeze and final-delivery regressions
        continue-on-error: true
        shell: bash
        run: |
          mapfile -t files < <(find tests -maxdepth 1 -type f \( -name 'test_final*' -o -name 'test_hard_freeze*' -o -name 'test_*reproduction*' \) | sort)
          if (( ${#files[@]} )); then
            python -m pytest -q "${files[@]}"
          else
            echo "No freeze/final diagnostic files matched."
          fi

      - name: Run authoritative production runtime tests
        run: python -m pytest -q tests

      - name: Regress accepted ADR-004 controller boundary
        run: python -m pytest -q research/e2/tests/test_controller.py

  standalone-wheel-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build production wheel
        run: |
          python -m pip install --upgrade pip
          python -m pip wheel . --no-deps --wheel-dir dist

      - name: Install only the production wheel in a clean environment
        run: |
          python -m venv /tmp/academy-tractian-wheel
          /tmp/academy-tractian-wheel/bin/python -m pip install --upgrade pip
          /tmp/academy-tractian-wheel/bin/python -m pip install dist/academy_tractian-*.whl

      - name: Smoke test installed wheel outside repository checkout
        working-directory: /tmp
        run: |
          /tmp/academy-tractian-wheel/bin/python - <<'PY'
          from academy_tractian import ProductionRuntimeConfig, canonical_tool_registry
          from research.e2.controller import AgentController

          registry = canonical_tool_registry()
          assert len(registry) == 18
          assert ProductionRuntimeConfig().actions_enabled is False
          assert AgentController.__name__ == "AgentController"
          print("standalone production wheel smoke passed")
          PY
