name: verification-supply-chain

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install project and auditor
        run: |
          python -m pip install --upgrade pip 'setuptools>=83.0.0'
          python -m pip install -e .
          python -m pip install pip-audit
      - name: Audit resolved third-party Python environment
        run: |
          python -m pip uninstall -y academy-tractian
          python -m pip_audit --strict

  frontend-dependencies:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci
      - name: Fail on high or critical npm advisories
        run: npm audit --audit-level=high
