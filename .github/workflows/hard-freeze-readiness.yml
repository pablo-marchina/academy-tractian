name: hard-freeze-readiness

on:
  pull_request:
    paths:
      - "src/academy_tractian/hard_freeze_readiness.py"
      - "scripts/hard_freeze_readiness.py"
      - "tests/test_hard_freeze_readiness.py"
      - ".github/workflows/hard-freeze-readiness.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  contract:
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"
      - name: Run hard-freeze readiness contract tests
        run: python -m pytest -q tests/test_hard_freeze_readiness.py
      - name: Compile live readiness CLI
        run: python -m py_compile scripts/hard_freeze_readiness.py

  live-readiness:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact current main
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" -e "research/e2[dev]"

      - name: Evaluate live hard-freeze readiness
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          CANDIDATE_SHA="$(git rev-parse HEAD)"
          python scripts/hard_freeze_readiness.py \
            --repository "${GITHUB_REPOSITORY}" \
            --candidate-sha "${CANDIDATE_SHA}" \
            --output hard-freeze-readiness.json

      - name: Publish sanitized readiness attestation
        uses: actions/upload-artifact@v4
        with:
          name: hard-freeze-readiness-${{ github.run_id }}
          path: hard-freeze-readiness.json
          if-no-files-found: error
          retention-days: 30
