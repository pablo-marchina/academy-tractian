name: research-e14t-full-dev-bounded-evidence-restoration

on:
  push:
    branches: [research/systematic-foundation]
    paths:
      - 'research/experiments/e14t-full-dev-bounded-evidence-restoration-preregistration.json'
      - 'scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard.py'
      - 'scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard_selfcheck.py'
      - '.github/workflows/research-e14t-full-dev-bounded-evidence-restoration.yml'
  pull_request:
    branches: [main]
    paths:
      - 'research/experiments/e14t-full-dev-bounded-evidence-restoration-preregistration.json'
      - 'scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard.py'
      - 'scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard_selfcheck.py'
      - '.github/workflows/research-e14t-full-dev-bounded-evidence-restoration.yml'

jobs:
  structural:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install public registry dependency
        run: python -m pip install 'pydantic>=2,<3'
      - name: Compile
        run: |
          python -m py_compile scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard.py
          python -m py_compile scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard_selfcheck.py
      - name: Run public synthetic self-check
        env:
          PYTHONPATH: .
        run: python scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard_selfcheck.py
      - name: Verify preregistration constants and forbidden selectors
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          p = Path('research/experiments/e14t-full-dev-bounded-evidence-restoration-preregistration.json')
          x = json.loads(p.read_text())
          assert x['status'] in {
              'PREREGISTERED_AFTER_E14S_AGGREGATE_FAILURE_AND_BEFORE_E14T_TRANSFORM',
              'ACTIVE_AFTER_STRUCTURAL_CI_PASS_BEFORE_E14T_TRANSFORM',
          }
          policy = x['restoration_policy']
          assert policy['maximum_additional_reads_total'] == 4
          assert policy['maximum_additional_reads_per_call'] == 1
          assert policy['maximum_final_reads_per_call'] == 7
          assert policy['maximum_final_reads_total'] == 63
          g = x['E14t_target_gate']
          assert g['fixed_calls_required'] == 10
          assert g['scoreable_calls_required'] == 10
          assert g['evidence_correctness_min'] == 0.5
          assert g['mean_expected_read_recall_min'] == 0.8333
          assert g['mean_extra_public_read_count_max'] == 3.5
          assert g['decision_correctness_required_unchanged'] == 0.8
          assert g['action_correctness_required_unchanged'] == 0.8
          assert g['escalation_correctness_required_unchanged'] == 0.8
          assert g['premature_action_rate_required'] == 0.0
          assert g['unsupported_action_or_escalation_rate_required'] == 0.0

          src = Path('scripts/research/e14t_full_dev_bounded_public_evidence_restoration_guard.py').read_text()
          forbidden_access_patterns = (
              '.get("coverage_tags")', ".get('coverage_tags')",
              '["coverage_tags"]', "['coverage_tags']",
              '.get("ticket_id")', ".get('ticket_id')",
              '["ticket_id"]', "['ticket_id']",
          )
          assert not any(pattern in src for pattern in forbidden_access_patterns)
          assert 'expected-paths.json' not in src
          assert 'private_scorer_rows_used": False' in src
          assert 'MAX_ADDITIONAL_READS_TOTAL = 4' in src
          assert 'MAX_FINAL_READS_TOTAL = 63' in src
          PY
