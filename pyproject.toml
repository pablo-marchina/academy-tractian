[project]
name = "academy-tractian"
version = "0.1.0"
description = "Production-path runtime surface for the TRACTIAN Academy project"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6,<3",
  "fastapi>=0.141.1,<0.142",
  "duckdb>=1.5.5,<1.6",
  "uvicorn>=0.52.4,<0.53",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.28,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academy_tractian"]

# Production imports accepted E2 runtime contracts through the existing
# `research.e2` namespace. Ship that frozen package at the same import path so
# the root wheel is self-contained without moving or rewriting E2 semantics.
[tool.hatch.build.targets.wheel.force-include]
"research/e2" = "research/e2"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
