[project]
name = "academy-tractian"
version = "0.1.0"
description = "Production-path runtime surface for the TRACTIAN Academy project"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.6,<3"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/academy_tractian"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
